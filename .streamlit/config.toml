[theme]
primaryColor = "#E7984E"
backgroundColor = "#080A09"
secondaryBackgroundColor = "#111412"
textColor = "#F5F7F4"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
# Community Cloud redeploys when Git changes. Disabling the in-process source
# watcher avoids sys.modules eviction races while the large app import graph is
# booting under Python 3.13.
fileWatcherType = "none"
headless = true
