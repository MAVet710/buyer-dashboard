services:
  - type: web
    name: doobielogic-api-rc
    runtime: python
    plan: free
    region: ohio
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: >-
      python -m pip install --upgrade pip &&
      python -m pip install -r backend/requirements.txt &&
      python -m compileall -q backend modules services reports migrations compliance_engine.py doobielogic_client.py delivery_impact.py
    startCommand: >-
      sh -c 'export RELEASE_SHA="${RENDER_GIT_COMMIT:-render}" &&
      export ALLOWED_HOSTS="api.doobielogic.io,${RENDER_EXTERNAL_HOSTNAME}" &&
      exec uvicorn backend.app.main:app --host 0.0.0.0 --port "${PORT:-10000}" --proxy-headers --forwarded-allow-ips="*"'
    healthCheckPath: /health/ready
    # Public domains terminate on Cloudflare; no Render custom-domain charges.
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://doobielogic.io,https://ops.doobielogic.io,https://cowboykush.doobielogic.io
      - key: DATABASE_POOL_SIZE
        value: "1"
      - key: DATABASE_MAX_OVERFLOW
        value: "0"
      - key: DATABASE_POOL_TIMEOUT
        value: "30"
      - key: AI_PROVIDER_MODE
        value: disabled
      - key: AI_PROVIDER_ORDER
        value: none
      - key: AI_ALLOW_CLOUD_FALLBACK
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false

  - type: web
    name: doobielogic-web-prod
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: >-
      corepack enable &&
      cd frontend &&
      pnpm install --frozen-lockfile &&
      pnpm build &&
      printf '{"release_sha":"%s"}\n' "${RENDER_GIT_COMMIT:-unknown}" > dist/release.json
    staticPublishPath: ./frontend/dist
    # See deploy/cloudflare/wrangler.jsonc for all public hostname routes.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /release.json
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://api.doobielogic.io
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
