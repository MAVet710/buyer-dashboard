name: Apply flat navigation shell patch

on:
  push:
    branches:
      - agent/ux-shell-flat-nav-product360
    paths:
      - .github/scripts/apply_flat_nav_patch.py
      - .github/workflows/apply-flat-nav-shell.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Integrate flat navigation shell'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-shell-flat-nav-product360
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply byte-preserving app patch
        run: python .github/scripts/apply_flat_nav_patch.py
      - name: Validate syntax
        run: python -m py_compile app.py modules/navigation/workspace_shell.py modules/navigation/product_360.py services/workspace_navigation.py
      - name: Remove one-shot patch machinery
        run: git rm .github/scripts/apply_flat_nav_patch.py .github/workflows/apply-flat-nav-shell.yml
      - name: Commit patch
        run: |
          git config user.name "MAVet710"
          git config user.email "149276571+MAVet710@users.noreply.github.com"
          git add app.py
          git commit -m "Integrate flat navigation shell"
          git push origin HEAD:agent/ux-shell-flat-nav-product360
