name: Apply Purchasing Overview Move

on:
  push:
    branches:
      - agent/purchasing-overview-move

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/purchasing-overview-move
          fetch-depth: 0

      - name: Apply navigation patch
        run: python scripts/apply_purchasing_overview_move.py

      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- services/workspace_navigation.py modules/navigation/workspace_shell.py modules/navigation/role_home.py
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "Move buyer overview into Purchasing"
          git push origin HEAD:agent/purchasing-overview-move
