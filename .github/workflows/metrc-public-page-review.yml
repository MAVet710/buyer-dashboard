name: MA Metrc Public Page Review
on:
  pull_request:
    paths:
      - '.github/workflows/metrc-public-page-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-page:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public method documentation only
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urlencode
          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
              def handle_data(self, data):
                  if data.strip(): self.parts.append(data.strip())
          keys = [
              'Sandbox.post_sandbox_v2_facility_tags.POST',
              'Sandbox.get_sandbox_v2_tagtypes.GET',
              'Sandbox.post_sandbox_v2_packages_create.POST',
              'Packages.post_packages_v2_.POST',
              'Sales.get_sales_v2_customertypes.GET',
          ]
          for key in keys:
              url = 'https://sandbox-api-ma.metrc.com/Documentation/Method?' + urlencode({'key': key})
              with urllib.request.urlopen(url, timeout=30) as response:
                  raw = response.read(1000001)
              if len(raw) > 1000000: raise RuntimeError('Documentation size exceeded')
              text = Text()
              text.feed(raw.decode('utf-8'))
              print('PUBLIC_METHOD', key, 'SHA256', hashlib.sha256(raw).hexdigest())
              print('\n'.join(text.parts))
          PY
