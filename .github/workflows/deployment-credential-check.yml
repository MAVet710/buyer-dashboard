name: Check deployment credential availability

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/deployment-credential-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      GCP_PROJECT_ID_SECRET: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT_ID_VAR: ${{ vars.GCP_PROJECT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
    steps:
      - name: Report configured deployment capabilities
        shell: bash
        run: |
          check() { if [[ -n "${!1:-}" ]]; then echo "$1=configured"; else echo "$1=missing"; fi; }
          check GCP_CREDENTIALS
          check GCP_SA_KEY
          check GOOGLE_CREDENTIALS
          check GCP_SERVICE_ACCOUNT_KEY
          check GCP_PROJECT_ID_SECRET
          check GCP_PROJECT_ID_VAR
          check CLOUDFLARE_API_TOKEN
          check CF_API_TOKEN
          check CLOUDFLARE_ACCOUNT_ID_SECRET
          check CLOUDFLARE_ACCOUNT_ID_VAR
          check CLOUDFLARE_PAGES_DEPLOY_HOOK
