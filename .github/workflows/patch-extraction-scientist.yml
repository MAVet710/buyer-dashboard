name: Patch Extraction Scientist Agent

on:
  push:
    branches:
      - agent/extraction-scientist-agent

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/extraction-scientist-agent
          fetch-depth: 0

      - name: Apply extraction scientist patch
        run: python scripts/patch_extraction_scientist_agent.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Validate extraction agent changes
        run: |
          python -m compileall -q services tests
          python -m pytest -q tests/test_extraction_agent.py tests/test_gemini_agent.py tests/test_agent_registry.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/agent_registry.py services/gemini_agent.py services/extraction_agent.py tests/test_extraction_agent.py .github/workflows/patch-extraction-scientist.yml scripts/patch_extraction_scientist_agent.py
          git commit -m "Upgrade extraction specialist agent"
          git push origin HEAD:agent/extraction-scientist-agent
