name: Temporary OpenCOA MA Discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/opencoa-ma-discovery.yml'

permissions:
  contents: read

jobs:
  inspect-opencoa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract exact Massachusetts replacement COA details
        shell: python
        run: |
          import json
          import re
          from html import unescape
          from urllib.request import Request, urlopen

          records = {
              'Animal Tsunami': 'https://opencoa.org/coa/019f4113-5e16-7299-b58c-5267d990c46e',
              'Gelato': 'https://opencoa.org/coa/01a03db3-6c29-72b0-bc0d-32d1b2a5aab8',
              'Lemon Cherry Gelato': 'https://opencoa.org/coa/019f4fda-a35e-72a7-b9e5-4437d31a7440',
          }
          headers = {
              'User-Agent': 'Mozilla/5.0 DoobieLogic DEV reference verification',
              'Referer': 'https://opencoa.org/search?state=MA&refine=1',
          }
          for strain, url in records.items():
              req = Request(url, headers=headers)
              with urlopen(req, timeout=30) as response:
                  html = response.read().decode('utf-8', errors='replace')
                  final_url = response.geturl()
              text = unescape(re.sub(r'<[^>]+>', ' ', html))
              text = re.sub(r'\s+', ' ', text).strip()
              print('=== DETAIL ' + strain + ' ===')
              print('FINAL_URL=' + final_url)
              print('DETAIL_TEXT=' + json.dumps(text[:24000], ensure_ascii=False))
