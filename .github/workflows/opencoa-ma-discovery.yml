name: Temporary OpenCOA MA Discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/opencoa-ma-discovery.yml'

permissions:
  contents: read

jobs:
  inspect-opencoa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Massachusetts flower candidates
        shell: python
        run: |
          import json
          from urllib.request import Request, urlopen

          BASE = 'https://opencoa.org'
          ENDPOINT = BASE + '/api/internal/app/search'
          targets = ('Animal Face', 'Gastro Pop', 'Gelato 41')
          headers = {
              'User-Agent': 'Mozilla/5.0 DoobieLogic DEV reference verification',
              'Content-Type': 'application/json',
              'Accept': 'application/json',
              'X-Requested-With': 'XMLHttpRequest',
              'Origin': BASE,
              'Referer': BASE + '/search?state=MA&refine=1',
          }
          payload = {'queries': [
              {
                  'indexUid': 'coas',
                  'q': target,
                  'limit': 15,
                  'offset': 0,
                  'facets': ['product_type', 'overall_status', 'brand_name', 'client_name', 'lab_name'],
                  'attributesToHighlight': ['identity_label', 'brand_display', 'lot_number'],
                  'filter': ['lab_state_id = 4', 'product_type = "flower"'],
                  'sort': ['analysis_date:desc'],
              }
              for target in targets
          ]}
          req = Request(ENDPOINT, data=json.dumps(payload).encode(), headers=headers, method='POST')
          with urlopen(req, timeout=30) as response:
              data = json.loads(response.read().decode())
          results = data.get('results') or []
          print('RESULT_SET_COUNT=' + str(len(results)))
          for target, result in zip(targets, results):
              hits = result.get('hits') or []
              print(f'=== MA FLOWER SEARCH {target}: total={result.get("estimatedTotalHits", result.get("totalHits"))} returned={len(hits)} ===')
              for hit in hits:
                  clean = {key: hit.get(key) for key in (
                      'id','url','identity_label','lot_number','batch_id_display','brand_display','client_name',
                      'product_type','lab_name','lab_state_id','analysis_date','date_display','overall_status',
                      'total_thc_percent','total_cbd_percent','total_cannabinoids_percent','total_terpenes_percent',
                      'has_regulatory_hold'
                  ) if hit.get(key) is not None}
                  print('HIT=' + json.dumps(clean, ensure_ascii=False, sort_keys=True))
