name: Temporary OpenCOA MA Discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/opencoa-ma-discovery.yml'

permissions:
  contents: read

jobs:
  inspect-opencoa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect OpenCOA search request schema
        shell: python
        run: |
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          BASE = 'https://opencoa.org'
          headers = {'User-Agent': 'Mozilla/5.0 DoobieLogic DEV reference verification'}

          def fetch(url):
              req = Request(url, headers=headers)
              with urlopen(req, timeout=30) as r:
                  return r.read().decode('utf-8', errors='replace')

          html = fetch(BASE + '/search?state=MA&refine=1')
          script_match = re.search(r'<script[^>]+src=[\"\']([^\"\']*search-page[^\"\']+)', html, flags=re.I)
          if not script_match:
              raise SystemExit('OpenCOA search bundle not found')
          script_url = urljoin(BASE, script_match.group(1))
          js = fetch(script_url)
          print('SEARCH_BUNDLE=' + script_url)
          start = js.find('function we(')
          if start < 0:
              raise SystemExit('OpenCOA request builder not found')
          print('REQUEST_BUILDER=' + js[start:start+14000])

          # Also print the serialized initial state so we can confirm Massachusetts' internal state id.
          marker = 'searchPage(JSON.parse('
          idx = html.find(marker)
          if idx >= 0:
              print('INITIAL_STATE_CONTEXT=' + re.sub(r'\s+', ' ', html[idx:idx+12000]))
