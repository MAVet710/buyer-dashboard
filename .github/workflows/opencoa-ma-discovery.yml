name: Temporary OpenCOA MA Discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/opencoa-ma-discovery.yml'

permissions:
  contents: read

jobs:
  inspect-opencoa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate final Massachusetts flower reference details
        shell: python
        run: |
          import json
          import re
          from html import unescape
          from urllib.request import Request, urlopen

          records = {
              'Candy Sparqs': 'https://opencoa.org/coa/019d9003-044f-73b4-9aa8-3b91d3647015',
              'Runtz OG': 'https://opencoa.org/coa/019f8195-5c06-7307-b641-78c051cade78',
          }
          headers = {
              'User-Agent': 'Mozilla/5.0 DoobieLogic DEV reference verification',
              'Referer': 'https://opencoa.org/search?state=MA&refine=1',
          }
          for strain, url in records.items():
              req = Request(url, headers=headers)
              with urlopen(req, timeout=30) as response:
                  html = response.read().decode('utf-8', errors='replace')
                  final_url = response.geturl()
              text = unescape(re.sub(r'<[^>]+>', ' ', html))
              text = re.sub(r'\s+', ' ', text).strip()
              print('=== DETAIL ' + strain + ' ===')
              print('FINAL_URL=' + final_url)
              print('DETAIL_TEXT=' + json.dumps(text[:30000], ensure_ascii=False))
