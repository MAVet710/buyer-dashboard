name: Reset DEV Sandbox Vertical Inventory

on:
  push:
    branches: [main]
    paths:
      - modules/coman/vertical_demo_inventory.py
      - modules/coman/vertical_demo_inventory_scale.py
      - modules/coman/vertical_demo_inventory_release.py
      - modules/coman/dev_sandbox_reset_job.py
      - scripts/reset_dev_sandbox_vertical_inventory.py
      - .github/workflows/reset-dev-sandbox-vertical-inventory.yml
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type I_APPROVE_DEV_SANDBOX_RESET to replace DEV Sandbox inventory"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dev-sandbox-vertical-inventory-reset
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reset dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate scaled DEV reset definition without database access
        run: |
          python - <<'PY'
          from modules.coman.vertical_demo_inventory import DEV_ORGANIZATION_SLUG, DEV_FACILITY_CODE
          from modules.coman.vertical_demo_inventory_release import (
              EXPECTED_ACTIVE_PLANTS,
              EXPECTED_TOTAL_PLANTS,
              EXPECTED_FLOWER_SKUS,
              EXPECTED_EXTRACT_SKUS,
              EXPECTED_FINISHED_SKUS,
              EXPECTED_MOCK_FINISHED_COAS,
          )
          from modules.coman.dev_sandbox_reset_job import run

          assert callable(run)
          assert DEV_ORGANIZATION_SLUG == "dev-sandbox"
          assert DEV_FACILITY_CODE == "SANDBOX"
          assert EXPECTED_ACTIVE_PLANTS == 80
          assert EXPECTED_TOTAL_PLANTS == 120
          assert EXPECTED_FLOWER_SKUS == 350
          assert EXPECTED_EXTRACT_SKUS == 150
          assert EXPECTED_FINISHED_SKUS == 500
          assert EXPECTED_MOCK_FINISHED_COAS == 50
          print("Scaled DEV vertical reset definition validated without contacting production.")
          PY

  apply:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'I_APPROVE_DEV_SANDBOX_RESET' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: dev-sandbox-data
    env:
      DL_PROD_DB_URL: ${{ secrets.DL_PROD_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Require explicit write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DL_PROD_DB_URL" || {
            echo "DL_PROD_DB_URL must be configured as a GitHub Actions secret before a manual DEV Sandbox reset."
            exit 1
          }
          echo "DEV Sandbox destructive reset is explicitly approved; credential value was not printed."

      - name: Install application dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Dry-run DEV Sandbox reset first
        run: python -m modules.coman.dev_sandbox_reset_job

      - name: Apply and validate DEV Sandbox vertical inventory replacement
        shell: bash
        run: |
          set -euo pipefail
          generation="${GITHUB_SHA:0:12}"
          python -m modules.coman.dev_sandbox_reset_job --apply --generation "$generation"

      - name: Record mutation boundary
        run: |
          {
            echo '## DEV Sandbox inventory reset'
            echo
            echo '- Trigger: manual workflow dispatch only'
            echo '- Confirmation: exact approval phrase required'
            echo '- Automatic main-push behavior: validation only; no database write'
            echo '- Google Cloud resources: none'
          } >> "$GITHUB_STEP_SUMMARY"
