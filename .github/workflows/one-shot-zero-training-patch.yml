name: One-shot zero-training patch

on:
  push:
    branches:
      - operator-zero-training-acceptance
    paths:
      - scripts/apply_zero_training_transient.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: operator-zero-training-acceptance
          fetch-depth: 0
      - name: Apply narrow transient-action fix
        run: python scripts/apply_zero_training_transient.py
      - name: Commit patched acceptance spec
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- frontend/e2e/operator-zero-training.spec.ts; then
            echo "No patch was required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/operator-zero-training.spec.ts
          git commit -m "Retry transient Extraction stage re-renders"
          git push origin HEAD:operator-zero-training-acceptance
