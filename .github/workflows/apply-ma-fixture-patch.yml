name: Apply final MA fixture patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-ma-fixture-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply final fixture and provenance hardening
        shell: python
        run: |
          from pathlib import Path

          scale_path = Path('modules/coman/vertical_demo_inventory_scale.py')
          scale = scale_path.read_text()
          old_strains = '''STRAINS = (
              "Gastro Pop",
              "GMO",
              "Strawberry Cough",
              "Blue Dream",
              "Wedding Cake",
              "Super Lemon Haze",
              "Gelato 41",
              "Motorbreath",
              "Permanent Marker",
              "Animal Face",
          )'''
          new_strains = '''STRAINS = (
              "Candy Sparqs",
              "GMO",
              "Strawberry Cough",
              "Blue Dream",
              "Wedding Cake",
              "Super Lemon Haze",
              "Runtz OG",
              "Motorbreath",
              "Permanent Marker",
              "Animal Tsunami",
          )'''
          if old_strains not in scale:
              raise SystemExit('Expected STRAINS block was not found')
          scale = scale.replace(old_strains, new_strains, 1)
          scale = scale.replace(
              'from modules.coman.vertical_demo_ma_coas import (\n    annotate_dev_flower_label_metadata,\n    seed_dev_ma_flower_reference_coa,\n)',
              'from modules.coman.vertical_demo_ma_coas import (\n    MA_FLOWER_REFERENCE_STRAINS,\n    annotate_dev_flower_label_metadata,\n    seed_dev_ma_flower_reference_coa,\n)',
              1,
          )
          guard_marker = '''    coman = ComanRepository(engine)
          master = ProductMasterRepository(engine)'''
          guard_replacement = '''    if set(STRAINS) != set(MA_FLOWER_REFERENCE_STRAINS):
              missing = sorted(set(STRAINS) - set(MA_FLOWER_REFERENCE_STRAINS))
              extra = sorted(set(MA_FLOWER_REFERENCE_STRAINS) - set(STRAINS))
              raise RuntimeError(f"DEV MA flower reference coverage mismatch: missing={missing} extra={extra}")

              coman = ComanRepository(engine)
          master = ProductMasterRepository(engine)'''
          # Preserve indentation exactly after embedding the guard.
          guard_replacement = guard_replacement.replace('\n              coman =', '\n    coman =')
          if guard_marker not in scale:
              raise SystemExit('Expected repository initialization marker was not found')
          scale = scale.replace(guard_marker, guard_replacement, 1)
          synthetic = '        _quality(engine, flower_lot_id, f"DEV-COA-{generation}-{code}-FLOWER", thca=25.0 + strain_index * 0.35, tac=28.0 + strain_index * 0.30, terpenes=1.7 + strain_index * 0.11, source="dev_vertical_harvest_lab", actor=actor)\n'
