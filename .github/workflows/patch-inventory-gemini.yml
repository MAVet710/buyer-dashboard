name: Patch Inventory Gemini Check

on:
  push:
    branches:
      - agent/inventory-gemini-check

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/inventory-gemini-check
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch_inventory_gemini.py

      - name: Validate targeted changes
        run: |
          python -m compileall -q app.py services/inventory_check.py tests/test_inventory_check.py
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests/test_inventory_check.py tests/test_gemini_agent.py tests/test_buyer_intelligence_brief.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py services/inventory_check.py tests/test_inventory_check.py .github/workflows/patch-inventory-gemini.yml scripts/patch_inventory_gemini.py
          git commit -m "Route inventory check through Gemini"
          git push origin HEAD:agent/inventory-gemini-check
