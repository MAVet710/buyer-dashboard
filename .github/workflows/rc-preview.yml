name: Release Candidate Preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doobielogic-rc-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  RC_ORGANIZATION_ID: rc-preview-org
  RC_FACILITY_ID: rc-preview-facility

jobs:
  local-release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce zero-cost deployment contract
        run: python scripts/verify_zero_cost_deployment.py

      - name: Verify strict Streamlit parity contract
        run: python scripts/verify_streamlit_parity.py --mode contract

      - name: Build API release-candidate image locally
        run: docker build -f Dockerfile.api -t buyer-dash-api:rc .

      - name: Verify production API startup
        run: |
          docker run --rm \
            -e APP_ENV=production \
            -e DATABASE_URL=sqlite+pysqlite:///:memory: \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_JWKS_URL=https://example.supabase.co/auth/v1/.well-known/jwks.json \
            -e SUPABASE_SERVICE_ROLE_KEY=test \
            -e INTEGRATION_ENCRYPTION_KEY=test \
            -e CORS_ORIGINS=https://preview.invalid \
            -e ALLOWED_HOSTS=preview.invalid \
            -e AI_PROVIDER_MODE=disabled \
            -e AI_PROVIDER_ORDER=none \
            -e AI_ALLOW_CLOUD_FALLBACK=false \
            buyer-dash-api:rc python -c "import backend.app.main; assert backend.app.main.app"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend release candidate
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:18080
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_PUBLISHABLE_KEY: ""
          VITE_ORGANIZATION_ID: ${{ env.RC_ORGANIZATION_ID }}
          VITE_FACILITY_ID: ${{ env.RC_FACILITY_ID }}
        run: pnpm build

      - name: Smoke test local synthetic API and static frontend pair
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f doobielogic-rc-api >/dev/null 2>&1 || true
            if [ -n "${WEB_PID:-}" ]; then kill "$WEB_PID" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT

          docker run --name doobielogic-rc-api --rm -d \
            -p 18080:8080 \
            -e APP_ENV=development \
            -e RC_PREVIEW=1 \
            -e DATABASE_URL=sqlite+pysqlite:////tmp/doobielogic-rc.db \
            -e CORS_ORIGINS=http://127.0.0.1:14173 \
            -e ALLOWED_HOSTS=127.0.0.1,localhost \
            buyer-dash-api:rc

          api_ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18080/health >/tmp/rc-health.json; then
              api_ready=1
              break
            fi
            sleep 1
          done
          test "$api_ready" = "1"

          corepack enable
          cd frontend
          pnpm exec vite preview --host 127.0.0.1 --port 14173 > /tmp/rc-vite.log 2>&1 &
          WEB_PID=$!
          cd ..

          web_ready=0
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:14173/ >/tmp/rc-web.html; then
              web_ready=1
              break
            fi
            sleep 1
          done
          test "$web_ready" = "1"

          context_code="$(curl --silent --output /tmp/rc-context.json --write-out '%{http_code}' \
            -H "X-Organization-Id: $RC_ORGANIZATION_ID" \
            -H "X-Facility-Id: $RC_FACILITY_ID" \
            -H "X-User-Id: web-local-developer" \
            -H "X-User-Role: admin" \
            http://127.0.0.1:18080/api/v1/account/context)"
          inventory_code="$(curl --silent --output /tmp/rc-inventory.json --write-out '%{http_code}' \
            -H "X-Organization-Id: $RC_ORGANIZATION_ID" \
            -H "X-Facility-Id: $RC_FACILITY_ID" \
            -H "X-User-Id: web-local-developer" \
            -H "X-User-Role: admin" \
            http://127.0.0.1:18080/api/v1/inventory/retail/packages)"

          test "$context_code" = "200"
          test "$inventory_code" = "200"
          grep -qi '<div id="root"' /tmp/rc-web.html
          grep -q 'RC-LOT-001' /tmp/rc-inventory.json

          {
            echo "COMMIT=$GITHUB_SHA"
            echo "MODE=local-synthetic-rc"
            echo "API_HEALTH=pass"
            echo "WEB_STATIC=pass"
            echo "ACCOUNT_CONTEXT=pass"
            echo "INVENTORY_SEED=pass"
            echo "BILLABLE_CLOUD_RESOURCES=none"
          } | tee rc-local-evidence.txt

          {
            echo '## DoobieLogic local release candidate'
            echo
            echo '- API container: passed'
            echo '- Static frontend: passed'
            echo '- Account context: passed'
            echo '- Seeded inventory: passed'
            echo '- External cloud preview resources: none'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: rc-local-evidence
          path: rc-local-evidence.txt
          retention-days: 7
