name: Public Runtime Performance Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  workflow_run:
    workflows: ["Deploy to DoobieLogic"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: public-runtime-performance-smoke
  cancel-in-progress: true

env:
  PRODUCTION_ORIGIN: https://ops.doobielogic.io
  RUNTIME_RECOVERY_LIMIT_SECONDS: "120"
  WARM_P95_LIMIT_SECONDS: "3.5"

jobs:
  production-latency:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Wait for PC-hosted public edge readiness
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          deadline=$(( started + RUNTIME_RECOVERY_LIMIT_SECONDS ))
          first_success=""

          while [ "$(date +%s)" -le "$deadline" ]; do
            code="$(curl --silent --show-error --max-time 30 \
              --output /tmp/ready.json \
              --write-out '%{http_code}' \
              "$PRODUCTION_ORIGIN/health/ready" || true)"

            if [ "$code" = "200" ] && jq -e '.schema_matches == true and (.schema_revision | length > 0)' /tmp/ready.json >/dev/null 2>&1; then
              first_success="$(date +%s)"
              release="$(jq -r '.release_sha // ""' /tmp/ready.json)"
              echo "READY_RELEASE_SHA=$release" >> "$GITHUB_ENV"
              break
            fi
            echo "PC-hosted public edge not ready yet (HTTP $code)."
            sleep 10
          done

          if [ -z "$first_success" ]; then
            echo "ops.doobielogic.io did not become schema-ready within ${RUNTIME_RECOVERY_LIMIT_SECONDS}s."
            cat /tmp/ready.json || true
            exit 1
          fi

          recovery_seconds=$(( first_success - started ))
          echo "RUNTIME_RECOVERY_SECONDS=$recovery_seconds" >> "$GITHUB_ENV"

      - name: Measure warm operator-edge readiness path
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/warm-latencies.txt
          for attempt in $(seq 1 5); do
            result="$(curl --silent --show-error --max-time 15 \
              --output "/tmp/warm-ready-$attempt.json" \
              --write-out '%{http_code} %{time_total}' \
              "$PRODUCTION_ORIGIN/health/ready")"
            code="${result%% *}"
            seconds="${result##* }"
            if [ "$code" != "200" ]; then
              echo "Warm readiness returned HTTP $code on attempt $attempt."
              cat "/tmp/warm-ready-$attempt.json" || true
              exit 1
            fi
            jq -e '.schema_matches == true and (.schema_revision | length > 0)' "/tmp/warm-ready-$attempt.json" >/dev/null
            printf '%s\n' "$seconds" >> /tmp/warm-latencies.txt
          done

          python - <<'PY'
          import math
          import os
          from pathlib import Path

          values = sorted(float(line) for line in Path('/tmp/warm-latencies.txt').read_text().splitlines() if line.strip())
          if len(values) != 5:
              raise SystemExit(f'Expected 5 warm samples, got {len(values)}')
          p95 = values[min(len(values) - 1, math.ceil(len(values) * 0.95) - 1)]
          median = values[len(values) // 2]
          limit = float(os.environ['WARM_P95_LIMIT_SECONDS'])
          recovery = os.environ.get('RUNTIME_RECOVERY_SECONDS', '?')
          release = os.environ.get('READY_RELEASE_SHA', '')
          print(f'Operator-edge median={median:.3f}s p95={p95:.3f}s limit={limit:.3f}s release={release}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## DoobieLogic PC-hosted public runtime smoke\n\n')
              summary.write('- Public origin: `https://ops.doobielogic.io`\n')
              summary.write('- Route: Cloudflare Tunnel -> PC-hosted Caddy -> FastAPI\n')
              summary.write(f'- Runtime recovery/readiness: **{recovery}s**\n')
              summary.write(f'- Release SHA reported by runtime: `{release}`\n')
              summary.write(f'- Warm median: **{median:.3f}s**\n')
              summary.write(f'- Warm p95: **{p95:.3f}s** (limit {limit:.3f}s)\n')
          if p95 > limit:
              raise SystemExit(f'Warm readiness p95 {p95:.3f}s exceeded {limit:.3f}s')
          PY
