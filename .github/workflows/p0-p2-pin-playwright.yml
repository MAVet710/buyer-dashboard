name: P0-P2 Pin Playwright

on:
  push:
    branches: [hardening/p0-p2-production-readiness]

permissions:
  contents: write

concurrency:
  group: p0-p2-pin-playwright
  cancel-in-progress: false

jobs:
  pin-and-prove:
    if: ${{ !contains(github.event.head_commit.message, '[p0-p2-deps]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/p0-p2-production-readiness

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Pin Playwright test runner in package and lockfile
        working-directory: frontend
        run: pnpm add --save-dev @playwright/test@1.55.0

      - name: Require warning-free frontend lint
        working-directory: frontend
        run: pnpm exec eslint . --max-warnings=0

      - name: Run frontend unit tests
        working-directory: frontend
        run: pnpm test

      - name: Build production frontend
        working-directory: frontend
        run: pnpm build

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit verified dependency lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package.json frontend/pnpm-lock.yaml; then
            echo "Playwright is already pinned; nothing to commit."
            exit 0
          fi
          git config user.name "DoobieLogic CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/package.json frontend/pnpm-lock.yaml
          git commit -m "[p0-p2-deps] Pin Playwright browser test runner"
          git push origin HEAD:hardening/p0-p2-production-readiness
