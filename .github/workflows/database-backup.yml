name: Encrypted production database backup

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to DoobieLogic"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup-and-restore-test:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      restore-postgres:
        image: postgres:17
        env:
          POSTGRES_DB: buyer_dash_restore
          POSTGRES_PASSWORD: restore-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d buyer_dash_restore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.DATABASE_BACKUP_ENCRYPTION_PASSPHRASE }}
      BACKUP_DB_HOST: aws-1-us-east-2.pooler.supabase.com
      BACKUP_DB_PORT: "5432"
      BACKUP_DB_NAME: postgres
      BACKUP_DB_USER: doobielogic_backup_runtime.fovxtygwcxubjzjgovva
      RESTORE_DATABASE_URL: postgresql://postgres:restore-test-only@127.0.0.1:5432/buyer_dash_restore
    steps:
      - name: Validate backup configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_BACKUP_ENCRYPTION_PASSPHRASE" ]]; then
            echo "DATABASE_BACKUP_ENCRYPTION_PASSPHRASE must be configured as a repository secret."
            exit 1
          fi
          if [[ ${#DATABASE_BACKUP_ENCRYPTION_PASSPHRASE} -lt 32 ]]; then
            echo "The backup encryption passphrase must contain at least 32 characters."
            exit 1
          fi
          [[ "$BACKUP_DB_USER" == doobielogic_backup_runtime.* ]] || {
            echo "Backup database user must remain the dedicated read-only runtime role."
            exit 1
          }
          echo "Backup configuration validated without requiring a stored database URL or database password."

      - name: Derive dedicated backup-role password in memory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import hmac
          import os

          source = os.environ["DATABASE_BACKUP_ENCRYPTION_PASSPHRASE"].encode("utf-8")
          password_bytes = hmac.new(source, b"doobielogic-backup-db-v1", hashlib.sha256).digest()
          password = base64.urlsafe_b64encode(password_bytes).decode("ascii").rstrip("=")
          if len(password) < 32:
              raise SystemExit("Derived backup-role password is unexpectedly short.")
          print(f"::add-mask::{password}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"PGPASSWORD={password}\n")
          print("Dedicated backup-role password derived without printing or persisting plaintext in source.")
          PY

      - name: Prove production backup credentials before dumping
        shell: bash
        run: |
          set -euo pipefail
          if ! docker run --rm \
            --env PGPASSWORD \
            --env PGCONNECT_TIMEOUT=15 \
            postgres:17 \
            psql \
            --host="$BACKUP_DB_HOST" \
            --port="$BACKUP_DB_PORT" \
            --username="$BACKUP_DB_USER" \
            --dbname="$BACKUP_DB_NAME" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --command 'select 1' >/dev/null 2>&1; then
            echo "::error::Dedicated production backup role was rejected or the database was unreachable. No backup artifact was created."
            exit 1
          fi
          echo "Dedicated production backup role authenticated successfully."

      - name: Install encryption client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnupg

      - name: Create consistent production backup
        shell: bash
        run: |
          set -euo pipefail
          backup_file="$RUNNER_TEMP/buyer-dash-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.dump"
          echo "BACKUP_FILE=$backup_file" >> "$GITHUB_ENV"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env PGPASSWORD \
            --env PGCONNECT_TIMEOUT=15 \
            --volume "$RUNNER_TEMP:/backup" \
            postgres:17 \
            pg_dump \
            --host="$BACKUP_DB_HOST" \
            --port="$BACKUP_DB_PORT" \
            --username="$BACKUP_DB_USER" \
            --dbname="$BACKUP_DB_NAME" \
            --schema=public \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-acl \
            --file="/backup/$(basename "$backup_file")"
          test -s "$backup_file"

      - name: Prove the backup restores
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network host \
            --env RESTORE_DATABASE_URL \
            --volume "$RUNNER_TEMP:/backup" \
            postgres:17 \
            pg_restore \
            --clean \
            --if-exists \
            --schema=public \
            --no-owner \
            --no-acl \
            --exit-on-error \
            --dbname="$RESTORE_DATABASE_URL" \
            "/backup/$(basename "$BACKUP_FILE")"
          migration_count="$(docker run --rm --network host --env RESTORE_DATABASE_URL postgres:17 \
            psql "$RESTORE_DATABASE_URL" --tuples-only --no-align --command 'select count(*) from alembic_version')"
          if [[ "$migration_count" != "1" ]]; then
            echo "Restored database does not contain exactly one Alembic revision row."
            exit 1
          fi
          restored_head="$(docker run --rm --network host --env RESTORE_DATABASE_URL postgres:17 \
            psql "$RESTORE_DATABASE_URL" --tuples-only --no-align --command 'select version_num from alembic_version')"
          test -n "$restored_head"
          echo "Restore verification succeeded at schema revision $restored_head."

      - name: Encrypt and checksum backup
        shell: bash
        run: |
          set -euo pipefail
          encrypted_file="$BACKUP_FILE.gpg"
          passphrase_file="$RUNNER_TEMP/backup-passphrase"
          printf '%s' "$DATABASE_BACKUP_ENCRYPTION_PASSPHRASE" > "$passphrase_file"
          chmod 600 "$passphrase_file"
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-file "$passphrase_file" \
            --output "$encrypted_file" \
            "$BACKUP_FILE"
          sha256sum "$encrypted_file" > "$encrypted_file.sha256"
          echo "ENCRYPTED_BACKUP_FILE=$encrypted_file" >> "$GITHUB_ENV"
          shred --remove "$passphrase_file"
          shred --remove "$BACKUP_FILE"

      - name: Retain encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: buyer-dash-production-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ENCRYPTED_BACKUP_FILE }}
            ${{ env.ENCRYPTED_BACKUP_FILE }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove runner backup files
        if: always()
        shell: bash
        run: |
          set +e
          unset PGPASSWORD
          if [[ -n "${BACKUP_FILE:-}" && -f "$BACKUP_FILE" ]]; then shred --remove "$BACKUP_FILE"; fi
          if [[ -n "${ENCRYPTED_BACKUP_FILE:-}" && -f "$ENCRYPTED_BACKUP_FILE" ]]; then shred --remove "$ENCRYPTED_BACKUP_FILE"; fi
          if [[ -n "${ENCRYPTED_BACKUP_FILE:-}" && -f "$ENCRYPTED_BACKUP_FILE.sha256" ]]; then shred --remove "$ENCRYPTED_BACKUP_FILE.sha256"; fi
