name: Encrypted production database backup

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to DoobieLogic"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup-and-restore-test:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      restore-postgres:
        image: postgres:17
        env:
          POSTGRES_DB: buyer_dash_restore
          POSTGRES_PASSWORD: restore-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d buyer_dash_restore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_BACKUP_URL: ${{ secrets.DATABASE_BACKUP_URL }}
      DL_PROD_DB_URL: ${{ secrets.DL_PROD_DB_URL }}
      DATABASE_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.DATABASE_BACKUP_ENCRYPTION_PASSPHRASE }}
      RESTORE_DATABASE_URL: postgresql://postgres:restore-test-only@127.0.0.1:5432/buyer_dash_restore
    steps:
      - name: Validate backup configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_BACKUP_URL" && -z "$DL_PROD_DB_URL" ]]; then
            echo "At least one of DATABASE_BACKUP_URL or DL_PROD_DB_URL must be configured as a repository secret."
            exit 1
          fi
          if [[ -z "$DATABASE_BACKUP_ENCRYPTION_PASSPHRASE" ]]; then
            echo "DATABASE_BACKUP_ENCRYPTION_PASSPHRASE must be configured as a repository secret."
            exit 1
          fi
          if [[ ${#DATABASE_BACKUP_ENCRYPTION_PASSPHRASE} -lt 32 ]]; then
            echo "The backup encryption passphrase must contain at least 32 characters."
            exit 1
          fi
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          candidates = {
              "DATABASE_BACKUP_URL": os.environ.get("DATABASE_BACKUP_URL", "").strip(),
              "DL_PROD_DB_URL": os.environ.get("DL_PROD_DB_URL", "").strip(),
          }
          for name, raw in candidates.items():
              if not raw:
                  continue
              normalized = raw.replace("postgresql+psycopg://", "postgresql://", 1)
              parsed = urlparse(normalized)
              if parsed.scheme not in {"postgres", "postgresql"}:
                  raise SystemExit(f"{name} must use a PostgreSQL URI.")
              if not parsed.hostname or not parsed.username or not parsed.path.strip("/"):
                  raise SystemExit(f"{name} is missing host, user, or database name.")
              if parsed.password is None:
                  raise SystemExit(f"{name} does not contain database authentication material.")
          print("Backup database URI candidates validated without exposing credentials.")
          PY

      - name: Prove production backup credentials before dumping
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local candidate="$1"
            [[ -n "$candidate" ]] || return 1
            docker run --rm \
              --env PGCONNECT_TIMEOUT=15 \
              postgres:17 \
              psql "$candidate" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --command 'select 1' >/dev/null 2>&1
          }

          chosen=""
          source_name=""
          if probe "$DATABASE_BACKUP_URL"; then
            chosen="$DATABASE_BACKUP_URL"
            source_name="DATABASE_BACKUP_URL"
          elif probe "$DL_PROD_DB_URL"; then
            chosen="$DL_PROD_DB_URL"
            source_name="DL_PROD_DB_URL"
          else
            echo "::error::Neither configured production database credential authenticated successfully. No backup artifact was created."
            exit 1
          fi

          echo "::add-mask::$chosen"
          printf 'DATABASE_BACKUP_URL=%s\n' "$chosen" >> "$GITHUB_ENV"
          echo "Production backup database authentication succeeded using $source_name."

      - name: Install encryption client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnupg

      - name: Create consistent production backup
        shell: bash
        run: |
          set -euo pipefail
          backup_file="$RUNNER_TEMP/buyer-dash-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.dump"
          echo "BACKUP_FILE=$backup_file" >> "$GITHUB_ENV"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env DATABASE_BACKUP_URL \
            --env PGCONNECT_TIMEOUT=15 \
            --volume "$RUNNER_TEMP:/backup" \
            postgres:17 \
            pg_dump "$DATABASE_BACKUP_URL" \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-acl \
            --file="/backup/$(basename "$backup_file")"
          test -s "$backup_file"

      - name: Prove the backup restores
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network host \
            --env RESTORE_DATABASE_URL \
            --volume "$RUNNER_TEMP:/backup" \
            postgres:17 \
            pg_restore \
            --clean \
            --if-exists \
            --schema=public \
            --no-owner \
            --no-acl \
            --exit-on-error \
            --dbname="$RESTORE_DATABASE_URL" \
            "/backup/$(basename "$BACKUP_FILE")"
          migration_count="$(docker run --rm --network host --env RESTORE_DATABASE_URL postgres:17 \
            psql "$RESTORE_DATABASE_URL" --tuples-only --no-align --command 'select count(*) from alembic_version')"
          if [[ "$migration_count" != "1" ]]; then
            echo "Restored database does not contain exactly one Alembic revision row."
            exit 1
          fi
          restored_head="$(docker run --rm --network host --env RESTORE_DATABASE_URL postgres:17 \
            psql "$RESTORE_DATABASE_URL" --tuples-only --no-align --command 'select version_num from alembic_version')"
          test -n "$restored_head"
          echo "Restore verification succeeded at schema revision $restored_head."

      - name: Encrypt and checksum backup
        shell: bash
        run: |
          set -euo pipefail
          encrypted_file="$BACKUP_FILE.gpg"
          passphrase_file="$RUNNER_TEMP/backup-passphrase"
          printf '%s' "$DATABASE_BACKUP_ENCRYPTION_PASSPHRASE" > "$passphrase_file"
          chmod 600 "$passphrase_file"
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-file "$passphrase_file" \
            --output "$encrypted_file" \
            "$BACKUP_FILE"
          sha256sum "$encrypted_file" > "$encrypted_file.sha256"
          echo "ENCRYPTED_BACKUP_FILE=$encrypted_file" >> "$GITHUB_ENV"
          shred --remove "$passphrase_file"
          shred --remove "$BACKUP_FILE"

      - name: Retain encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: buyer-dash-production-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ENCRYPTED_BACKUP_FILE }}
            ${{ env.ENCRYPTED_BACKUP_FILE }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove runner backup files
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${BACKUP_FILE:-}" && -f "$BACKUP_FILE" ]]; then shred --remove "$BACKUP_FILE"; fi
          if [[ -n "${ENCRYPTED_BACKUP_FILE:-}" && -f "$ENCRYPTED_BACKUP_FILE" ]]; then shred --remove "$ENCRYPTED_BACKUP_FILE"; fi
          if [[ -n "${ENCRYPTED_BACKUP_FILE:-}" && -f "$ENCRYPTED_BACKUP_FILE.sha256" ]]; then shred --remove "$ENCRYPTED_BACKUP_FILE.sha256"; fi
