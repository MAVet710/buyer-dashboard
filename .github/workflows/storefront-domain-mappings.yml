name: Hosted Storefront Domains

on:
  push:
    branches: [main]
    paths:
      - "deploy/storefront-domains.txt"
      - "scripts/validate_storefront_domains.py"
      - ".github/workflows/storefront-domain-mappings.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doobielogic-storefront-domains
  cancel-in-progress: true

env:
  DOMAIN_CONFIG: deploy/storefront-domains.txt

jobs:
  validate-domain-aliases:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate approved storefront domains
        run: python scripts/validate_storefront_domains.py "$DOMAIN_CONFIG"

      - name: Verify aliases fit the free static-host model
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t domains < <(python scripts/validate_storefront_domains.py "$DOMAIN_CONFIG" --print)
          count="${#domains[@]}"
          if [ "$count" -gt 50 ]; then
            echo "Approved storefront aliases ($count) exceed the conservative 50-alias free-host operating limit."
            exit 1
          fi

          for domain in "${domains[@]}"; do
            case "$domain" in
              api.doobielogic.io|ops.doobielogic.io|www.doobielogic.io)
                echo "Reserved platform domain unexpectedly entered storefront list: $domain"
                exit 1
                ;;
            esac
          done

          {
            echo '## Approved DoobieCommerce storefront aliases'
            echo
            echo "Validated **$count** exact storefront hostname(s)."
            echo
            for domain in "${domains[@]}"; do
              echo "- \`$domain\`"
            done
            echo
            echo 'These hosts are routed by the React storefront host boundary and must be attached as domain aliases to the free Render static site. This workflow validates only; it never creates DNS or cloud resources.'
          } >> "$GITHUB_STEP_SUMMARY"
