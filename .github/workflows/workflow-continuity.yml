name: Workflow continuity acceptance

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/app/services/label_run_history.py'
      - 'backend/app/services/purchase_order_continuity.py'
      - 'backend/app/routers/label_printing.py'
      - 'backend/app/routers/purchasing.py'
      - 'services/purchase_order_pdf.py'
      - 'tests/test_label_history_continuity.py'
      - 'tests/test_purchase_order_continuity.py'
      - 'tests/test_dev_sandbox_label_print_contract.py'
      - 'tests/test_label_production_workflow_contract.py'
      - 'tests/test_web_inventory_api.py'
      - '.github/workflows/workflow-continuity.yml'

permissions:
  contents: read

concurrency:
  group: workflow-continuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  saved-workflows-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install repository test dependencies
        run: python -m pip install -r requirements.txt -r backend/requirements.txt pytest httpx
      # Separate processes prevent unrelated test collection from accidentally
      # registering a missing model and hiding an isolated-fixture regression.
      - name: Verify label history in an isolated test process
        run: python -m pytest -q tests/test_label_history_continuity.py --junitxml=artifacts/workflow-continuity/labels.xml
      - name: Verify saved purchase orders in an isolated test process
        run: python -m pytest -q tests/test_purchase_order_continuity.py --junitxml=artifacts/workflow-continuity/purchase-orders.xml
      - name: Preserve sandbox restrictions and label workflow contracts
        run: python -m pytest -q tests/test_dev_sandbox_label_print_contract.py tests/test_label_production_workflow_contract.py --junitxml=artifacts/workflow-continuity/label-contracts.xml
      - name: Verify sales reporting window without changing durable inventory
        run: python -m pytest -q tests/test_web_inventory_api.py::test_retail_sales_import_is_durable_idempotent_and_audited --junitxml=artifacts/workflow-continuity/sales-window.xml
      - name: Save backend continuity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-workflow-backend-evidence
          path: artifacts/workflow-continuity/*.xml
          retention-days: 7
          if-no-files-found: ignore

  saved-workflows-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint . --max-warnings=0
      - run: pnpm build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.55.0
      - run: pnpm exec playwright install --with-deps chromium
      - name: Exercise saved workflow history and reload continuity
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4173 > /tmp/doobielogic-continuity-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/doobielogic-continuity-vite.log; exit 1; fi
          pnpm exec playwright test --config=playwright.config.ts e2e/label-history-reprints.spec.ts e2e/label-history-continuity.spec.ts e2e/purchase-order-continuity.spec.ts e2e/production-run-continuity.spec.ts
      - name: Save browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-workflow-browser-evidence
          path: frontend/test-results/browser-parity
          retention-days: 7
          if-no-files-found: ignore
