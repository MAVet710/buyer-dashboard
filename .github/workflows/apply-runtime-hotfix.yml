name: Apply runtime hotfix

on:
  push:
    branches:
      - agent/fix-streamlit-runtime-crashes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Apply targeted source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("app.py"): [
                  (
                      b'rename(columns={sales_cat_col:"Category","%s":"Sales"%sales_col})',
                      b'rename(columns={sales_cat_col:"Category", sales_col:"Sales Window Retail Sales"})',
                  ),
              ],
              Path("modules/coman/ui.py"): [
                  (
                      b'"Minimum Operators": model.minimum_operators,',
                      b'"Minimum Operators": model.published_min_operators,',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              data = path.read_bytes()
              for old, new in pairs:
                  count = data.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one match in {path} for {old!r}, found {count}")
                  data = data.replace(old, new, 1)
              path.write_bytes(data)

          Path("tests/test_runtime_regressions.py").write_text(
              '''from pathlib import Path\n\nfrom modules.coman.models import MachineModel\n\n\ndef test_purchasing_budget_category_rename_avoids_string_formatting_bug():\n    source = Path("app.py").read_text(encoding="utf-8")\n    assert '\"%s\":\"Sales\"%sales_col' not in source\n    assert 'sales_col:\"Sales Window Retail Sales\"' in source\n\n\ndef test_coman_machine_library_uses_published_operator_field():\n    source = Path("modules/coman/ui.py").read_text(encoding="utf-8")\n    assert "model.minimum_operators" not in source\n    assert "model.published_min_operators" in source\n    assert hasattr(MachineModel, "published_min_operators")\n''',
              encoding="utf-8",
          )
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-runtime-hotfix.yml

      - name: Commit hotfix
        run: |
          git config user.name "MAVet710"
          git config user.email "149276571+MAVet710@users.noreply.github.com"
          git add app.py modules/coman/ui.py tests/test_runtime_regressions.py .github/workflows/apply-runtime-hotfix.yml
          git commit -m "Fix Streamlit runtime crashes"
          git push origin HEAD:agent/fix-streamlit-runtime-crashes
