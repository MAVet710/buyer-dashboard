name: Final MA fixture cleanup v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/final-ma-fixture-cleanup-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Correct package-date fallback and stale test scope
        shell: python
        run: |
          from pathlib import Path

          source = Path('modules/coman/vertical_demo_ma_coas.py')
          text = source.read_text()
          old = '            package_date = lot.received_at.date().isoformat() if lot.received_at else ""\n'
          new = '            package_date = lot.received_at.date().isoformat() if lot.received_at else harvest_date\n'
          if old not in text:
              raise SystemExit('Expected blank package-date fallback was not found')
          text = text.replace(old, new, 1)
          old_meta = '                    "package_date": package_date,\n                    "cultivated_by": facility.name,\n'
          new_meta = '                    "package_date": package_date,\n                    "package_date_basis": ("lot_received_at" if lot.received_at else "harvest_date_fallback"),\n                    "cultivated_by": facility.name,\n'
          if old_meta not in text:
              raise SystemExit('Expected package-date metadata block was not found')
          source.write_text(text.replace(old_meta, new_meta, 1))

          test_path = Path('tests/test_dev_sandbox_vertical_inventory.py')
          test = test_path.read_text()
          stale = 'cultivation.list_plants(other.id, other.id)'
          if stale in test:
              test = test.replace(stale, 'cultivation.list_plants(other.id, facility.id)', 1)
          old_assert = '            assert meta["manufacture_date"]\n            assert meta["cultivated_by"] == sandbox.name\n'
          new_assert = '            assert meta["manufacture_date"]\n            assert meta["package_date_basis"] in {"lot_received_at", "harvest_date_fallback"}\n            assert meta["cultivated_by"] == sandbox.name\n'
          if old_assert not in test:
              raise SystemExit('Expected package-date acceptance assertions were not found')
          test_path.write_text(test.replace(old_assert, new_assert, 1).rstrip() + '\n')
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r backend/requirements.txt pytest httpx
      - name: Run focused DEV vertical acceptance
        env:
          PYTHONHASHSEED: '0'
        run: python -m pytest -q tests/test_dev_sandbox_vertical_inventory.py
      - name: Commit clean final acceptance patch
        run: |
          rm -f .github/workflows/final-ma-fixture-cleanup.yml
          rm -f .github/workflows/final-ma-fixture-cleanup-v2.yml
          git diff --check
          python -m py_compile modules/coman/vertical_demo_ma_coas.py tests/test_dev_sandbox_vertical_inventory.py
          git config user.name 'DoobieLogic fixture hardening'
          git config user.email '149276571+MAVet710@users.noreply.github.com'
          git add -A
          git commit -m 'Finish DEV flower reference acceptance hardening'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
