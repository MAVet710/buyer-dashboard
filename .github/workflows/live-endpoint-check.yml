name: Verify live DoobieLogic endpoints

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/live-endpoint-check.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve DNS
        shell: bash
        run: |
          echo 'ops.doobielogic.io DNS:'
          dig +short ops.doobielogic.io A
          dig +short ops.doobielogic.io CNAME
          echo 'api.doobielogic.io DNS:'
          dig +short api.doobielogic.io A
          dig +short api.doobielogic.io CNAME

      - name: Probe frontend
        shell: bash
        run: |
          status=$(curl --silent --show-error --location --output /tmp/ops.html --write-out '%{http_code}' --connect-timeout 10 --max-time 30 https://ops.doobielogic.io/ || true)
          echo "frontend_status=$status"
          echo "frontend_bytes=$(wc -c </tmp/ops.html 2>/dev/null || echo 0)"
          if [[ -f /tmp/ops.html ]]; then
            grep -Eio '<title>[^<]+</title>' /tmp/ops.html | head -1 || true
            grep -Eo '/assets/[^" ]+\.js' /tmp/ops.html | head -1 || true
          fi
          test "$status" = "200"

      - name: Probe API health
        shell: bash
        run: |
          status=$(curl --silent --show-error --location --output /tmp/api-health.json --write-out '%{http_code}' --connect-timeout 10 --max-time 30 https://api.doobielogic.io/health || true)
          echo "api_health_status=$status"
          cat /tmp/api-health.json 2>/dev/null || true
          echo
          test "$status" = "200"

      - name: Probe API readiness
        shell: bash
        run: |
          status=$(curl --silent --show-error --location --output /tmp/api-ready.json --write-out '%{http_code}' --connect-timeout 10 --max-time 30 https://api.doobielogic.io/health/ready || true)
          echo "api_ready_status=$status"
          cat /tmp/api-ready.json 2>/dev/null || true
          echo
          test "$status" = "200"
