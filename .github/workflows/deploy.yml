name: Deploy to DoobieLogic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doobielogic-production-release-gate
  cancel-in-progress: false

jobs:
  zero-cost-release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce zero-cost deployment contract
        run: python scripts/verify_zero_cost_deployment.py

      - name: Block incomplete Streamlit parity from release
        run: python scripts/verify_streamlit_parity.py --mode release

      - name: Build API release image locally
        run: docker build -f Dockerfile.api -t doobielogic-api-release-check .

      - name: Verify API image has exactly one Alembic head
        shell: bash
        run: |
          set -euo pipefail
          heads="$(docker run --rm doobielogic-api-release-check alembic heads)"
          printf '%s\n' "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one Alembic head; found $count"
            exit 1
          fi

      - name: Verify production API startup contract
        run: |
          docker run --rm \
            -e APP_ENV=production \
            -e DATABASE_URL=sqlite+pysqlite:///:memory: \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_JWKS_URL=https://example.supabase.co/auth/v1/.well-known/jwks.json \
            -e SUPABASE_SERVICE_ROLE_KEY=test \
            -e INTEGRATION_ENCRYPTION_KEY=test \
            -e CORS_ORIGINS=https://doobielogic.io,https://ops.doobielogic.io \
            -e ALLOWED_HOSTS=api.doobielogic.io,doobielogic-api.onrender.com \
            -e AI_PROVIDER_MODE=disabled \
            -e AI_PROVIDER_ORDER=none \
            -e AI_ALLOW_CLOUD_FALLBACK=false \
            doobielogic-api-release-check python -c "import backend.app.main; assert backend.app.main.app"

      - name: Record zero-cost release handoff
        shell: bash
        run: |
          {
            echo '## DoobieLogic zero-cost release gate'
            echo
            echo '- Frontend host: Netlify Free (Git-based deploy; hard usage limit)'
            echo '- API host: Render Free (Git-based deploy; free compute instance)'
            echo '- Database/auth: existing Supabase configuration'
            echo '- Paid Google deployment path: disabled'
            echo '- Cloud AI fallback: disabled'
            echo
            echo 'After this gate and the repository checks are green, the connected Netlify and Render Git integrations own deployment from main.'
          } >> "$GITHUB_STEP_SUMMARY"
