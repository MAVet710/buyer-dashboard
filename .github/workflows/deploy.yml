name: Deploy to DoobieLogic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doobielogic-production-release-gate
  cancel-in-progress: false

env:
  RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  parity-release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce PC-hosted zero-cost deployment contract
        run: python scripts/verify_zero_cost_deployment.py

      - name: Block incomplete Streamlit parity from release
        run: python scripts/verify_streamlit_parity.py --mode release

  local-runtime-release-gate:
    needs: parity-release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build API release image locally
        run: docker build -f Dockerfile.api -t doobielogic-api-release-check .

      - name: Verify API image has exactly one Alembic head
        shell: bash
        run: |
          set -euo pipefail
          heads="$(docker run --rm doobielogic-api-release-check alembic heads)"
          printf '%s\n' "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one Alembic head; found $count"
            exit 1
          fi

      - name: Verify PC-hosted API startup contract
        run: |
          docker run --rm \
            -e APP_ENV=production \
            -e DATABASE_URL=sqlite+pysqlite:///:memory: \
            -e SUPABASE_URL=http://127.0.0.1:54321 \
            -e SUPABASE_JWKS_URL=http://127.0.0.1:54321/auth/v1/.well-known/jwks.json \
            -e SUPABASE_PUBLISHABLE_KEY=test-publishable \
            -e INTEGRATION_ENCRYPTION_KEY=test \
            -e CORS_ORIGINS=https://doobielogic.io,https://ops.doobielogic.io \
            -e ALLOWED_HOSTS=ops.doobielogic.io,doobielogic.io,localhost,127.0.0.1,testserver \
            -e AI_PROVIDER_MODE=disabled \
            -e AI_PROVIDER_ORDER=none \
            -e AI_ALLOW_CLOUD_FALLBACK=false \
            doobielogic-api-release-check python -c "import backend.app.main; assert backend.app.main.app"

      - name: Record PC-hosted release validation
        shell: bash
        run: |
          {
            echo '## DoobieLogic PC-hosted release validation'
            echo
            echo "- Release identity: \`$RELEASE_ID\`"
            echo '- Public operator URL: https://ops.doobielogic.io'
            echo '- Public edge: Cloudflare Tunnel'
            echo '- Local web edge: Caddy on 127.0.0.1:8080'
            echo '- Local API: FastAPI on 127.0.0.1:8010'
            echo '- Local auth gateway: Supabase on 127.0.0.1:54321'
            echo '- Cloud AI fallback: disabled'
            echo
            echo 'No external deployment is performed by this workflow. Production remains hosted from the Windows PC and is exposed through Cloudflare Tunnel.'
          } >> "$GITHUB_STEP_SUMMARY"
