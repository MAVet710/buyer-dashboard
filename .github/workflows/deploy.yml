name: Deploy to DoobieLogic

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: doobielogic-production
  cancel-in-progress: false

env:
  REGISTRY: us-east1-docker.pkg.dev
  API_SERVICE: buyer-dash-api
  WEB_SERVICE: buyer-dash-web
  MIGRATION_JOB: buyer-dash-migrate
  REGION: us-east1
  PRODUCTION_API_URL: https://api.doobielogic.io
  API_MAX_INSTANCES: 3
  DATABASE_POOL_SIZE: 2
  SUPABASE_SESSION_LIMIT: 15
  SUPABASE_SESSION_HEADROOM: 3

jobs:
  parity-release-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Block incomplete Streamlit parity from production
        run: python scripts/verify_streamlit_parity.py --mode release
      - name: Verify production API image builds
        run: docker build -f Dockerfile.api -t doobielogic-api-release-check .
      - name: Verify API image has exactly one Alembic head
        run: |
          set -euo pipefail
          HEADS="$(docker run --rm doobielogic-api-release-check alembic heads)"
          echo "$HEADS"
          HEAD_COUNT="$(printf '%s\n' "$HEADS" | grep -c '(head)' || true)"
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "Expected exactly one Alembic head; found $HEAD_COUNT"
            exit 1
          fi
      - name: Verify Supabase session budget
        run: |
          set -euo pipefail
          STEADY=$(( DATABASE_POOL_SIZE * API_MAX_INSTANCES ))
          ROLLING=$(( STEADY * 2 ))
          SAFE=$(( SUPABASE_SESSION_LIMIT - SUPABASE_SESSION_HEADROOM ))
          echo "steady-state sessions <= $STEADY; rolling-revision worst case <= $ROLLING; safe budget = $SAFE"
          if [ "$ROLLING" -gt "$SAFE" ]; then
            echo "Refusing deployment: configured API pool/scale can exceed the reserved Supabase session budget"
            exit 1
          fi

  deploy-api:
    needs: parity-release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      api_url: ${{ steps.verify_production.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build, identify, and push immutable production API image
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/buyer-dash/${{ env.API_SERVICE }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          docker build -f Dockerfile.api -t "$IMAGE" .

          HEADS="$(docker run --rm "$IMAGE" alembic heads)"
          echo "$HEADS"
          HEAD_COUNT="$(printf '%s\n' "$HEADS" | grep -c '(head)' || true)"
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "Refusing deployment: API image has $HEAD_COUNT Alembic heads"
            exit 1
          fi
          IMAGE_SCHEMA_HEAD="$(printf '%s\n' "$HEADS" | awk 'NR==1 {print $1}')"
          test -n "$IMAGE_SCHEMA_HEAD"
          echo "API image schema head: $IMAGE_SCHEMA_HEAD"

          docker push "$IMAGE"
          IMAGE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project "${{ secrets.GCP_PROJECT_ID }}" --format='value(image_summary.digest)')"
          test -n "$IMAGE_DIGEST"
          echo "API image digest: $IMAGE_DIGEST"
          echo "API_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "API_IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_SCHEMA_HEAD=$IMAGE_SCHEMA_HEAD" >> "$GITHUB_ENV"

      - name: Capture and preflight currently healthy production API revision
        run: |
          set -euo pipefail
          SERVICE_JSON="$(gcloud run services describe "${{ env.API_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --format=json)"
          PREVIOUS_API_REVISION="$(printf '%s' "$SERVICE_JSON" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName][0] // ""')"
          SERVICE_URL="$(printf '%s' "$SERVICE_JSON" | jq -r '.status.url // ""')"
          test -n "$PREVIOUS_API_REVISION"
          test -n "$SERVICE_URL"

          health_code="$(curl -sS -o /tmp/pre-api-health.json -w '%{http_code}' "${{ env.PRODUCTION_API_URL }}/health" || true)"
          ready_code="$(curl -sS -o /tmp/pre-api-ready.json -w '%{http_code}' "${{ env.PRODUCTION_API_URL }}/health/ready" || true)"
          if [ "$health_code" != "200" ] || [ "$ready_code" != "200" ]; then
            echo "Refusing deployment because the current production API is not healthy (health=$health_code ready=$ready_code)."
            cat /tmp/pre-api-health.json || true
            cat /tmp/pre-api-ready.json || true
            exit 1
          fi

          echo "Previous healthy API revision: $PREVIOUS_API_REVISION"
          echo "PREVIOUS_API_REVISION=$PREVIOUS_API_REVISION" >> "$GITHUB_ENV"
          echo "API_SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

      - name: Run production database migrations
        run: |
          set -euo pipefail
          gcloud run jobs deploy "${{ env.MIGRATION_JOB }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --image "$API_IMAGE" \
            --region "${{ env.REGION }}" \
            --service-account "buyer-dash-migrate@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --command alembic \
            --args upgrade,head \
            --max-retries 0 \
            --task-timeout 15m \
            --set-env-vars APP_ENV=production \
            --set-secrets DATABASE_URL=buyer-dash-database-url:latest \
            --quiet
          gcloud run jobs execute "${{ env.MIGRATION_JOB }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --wait

      - name: Deploy API candidate without traffic
        run: |
          set -euo pipefail
          API_CANDIDATE_TAG="api-candidate-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "API_CANDIDATE_TAG=$API_CANDIDATE_TAG" >> "$GITHUB_ENV"
          gcloud run deploy "${{ env.API_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --image "$API_IMAGE" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --service-account "buyer-dash-api@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --no-traffic \
            --tag "$API_CANDIDATE_TAG" \
            --port 8080 \
            --min-instances 1 \
            --max-instances "${{ env.API_MAX_INSTANCES }}" \
            --concurrency 40 \
            --cpu 1 \
            --memory 1Gi \
            --set-env-vars "^@^APP_ENV=production@CORS_ORIGINS=https://ops.doobielogic.io@ALLOWED_HOSTS=api.doobielogic.io,*.run.app@DATABASE_POOL_SIZE=${{ env.DATABASE_POOL_SIZE }}@DATABASE_MAX_OVERFLOW=0@DATABASE_POOL_TIMEOUT=30@RELEASE_SHA=${{ github.sha }}@EXPECTED_SCHEMA_HEAD=$IMAGE_SCHEMA_HEAD" \
            --set-secrets "DATABASE_URL=buyer-dash-database-url:latest,SUPABASE_URL=buyer-dash-supabase-url:latest,SUPABASE_JWKS_URL=buyer-dash-supabase-jwks-url:latest,SUPABASE_SERVICE_ROLE_KEY=buyer-dash-supabase-service-role:latest,INTEGRATION_ENCRYPTION_KEY=buyer-dash-integration-encryption-key:latest" \
            --quiet

      - name: Verify exact API candidate revision and HTTP health
        run: |
          set -euo pipefail

          dump_candidate_logs() {
            if [ -n "${CREATED_API_REVISION:-}" ]; then
              echo "=== API candidate revision ==="
              gcloud run revisions describe "$CREATED_API_REVISION" \
                --project "${{ secrets.GCP_PROJECT_ID }}" \
                --region "${{ env.REGION }}" \
                --format='yaml(metadata.name,spec.containers,status.conditions)' || true
              echo "=== API candidate logs ==="
              gcloud logging read \
                "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${{ env.API_SERVICE }}\" AND resource.labels.revision_name=\"$CREATED_API_REVISION\"" \
                --project "${{ secrets.GCP_PROJECT_ID }}" \
                --limit 200 \
                --order=asc \
                --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
            fi
          }
          trap 'status=$?; if [ "$status" -ne 0 ]; then dump_candidate_logs; fi' EXIT

          SERVICE_JSON="$(gcloud run services describe "${{ env.API_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --format=json)"
          CREATED_API_REVISION="$(printf '%s' "$SERVICE_JSON" | jq -r '.status.latestCreatedRevisionName // ""')"
          test -n "$CREATED_API_REVISION"
          if [ "$CREATED_API_REVISION" = "$PREVIOUS_API_REVISION" ]; then
            echo "Refusing cutover: Cloud Run did not create a new API revision."
            exit 1
          fi

          CANDIDATE_REVISION=""
          CANDIDATE_URL=""
          for attempt in $(seq 1 20); do
            SERVICE_JSON="$(gcloud run services describe "${{ env.API_SERVICE }}" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --region "${{ env.REGION }}" \
              --format=json)"
            CANDIDATE_REVISION="$(printf '%s' "$SERVICE_JSON" | jq -r --arg tag "$API_CANDIDATE_TAG" '[.status.traffic[]? | select(.tag == $tag) | .revisionName][0] // ""')"
            CANDIDATE_URL="$(printf '%s' "$SERVICE_JSON" | jq -r --arg tag "$API_CANDIDATE_TAG" '[.status.traffic[]? | select(.tag == $tag) | .url][0] // ""')"
            if [ "$CANDIDATE_REVISION" = "$CREATED_API_REVISION" ] && [ -n "$CANDIDATE_URL" ]; then break; fi
            sleep 3
          done
          if [ "$CANDIDATE_REVISION" != "$CREATED_API_REVISION" ] || [ -z "$CANDIDATE_URL" ]; then
            echo "Refusing cutover: the candidate tag does not resolve to the exact newly created API revision."
            exit 1
          fi

          gcloud run revisions describe "$CREATED_API_REVISION" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --format=json > /tmp/api-candidate-revision.json
          READY_STATUS="$(jq -r '[.status.conditions[]? | select(.type == "Ready") | .status][0] // ""' /tmp/api-candidate-revision.json)"
          REV_RELEASE="$(jq -r '[.spec.containers[0].env[]? | select(.name == "RELEASE_SHA") | .value][0] // ""' /tmp/api-candidate-revision.json)"
          REV_SCHEMA="$(jq -r '[.spec.containers[0].env[]? | select(.name == "EXPECTED_SCHEMA_HEAD") | .value][0] // ""' /tmp/api-candidate-revision.json)"
          REV_IMAGE="$(jq -r '.spec.containers[0].image // ""' /tmp/api-candidate-revision.json)"
          echo "candidate=$CREATED_API_REVISION ready=$READY_STATUS release=$REV_RELEASE schema=$REV_SCHEMA image=$REV_IMAGE"

          [ "$READY_STATUS" = "True" ] || { echo "API candidate is not Ready."; exit 1; }
          [ "$REV_RELEASE" = "${{ github.sha }}" ] || { echo "API candidate RELEASE_SHA does not match github.sha."; exit 1; }
          [ "$REV_SCHEMA" = "$IMAGE_SCHEMA_HEAD" ] || { echo "API candidate EXPECTED_SCHEMA_HEAD does not match image Alembic head."; exit 1; }
          case "$REV_IMAGE" in
            *@"$API_IMAGE_DIGEST") ;;
            *) echo "API candidate is not running the image digest built by this workflow."; exit 1 ;;
          esac

          candidate_ok=false
          for attempt in $(seq 1 20); do
            health_code="$(curl -sS -o /tmp/candidate-api-health.json -w '%{http_code}' "$CANDIDATE_URL/health" || true)"
            ready_code="$(curl -sS -o /tmp/candidate-api-ready.json -w '%{http_code}' "$CANDIDATE_URL/health/ready" || true)"
            if [ "$health_code" = "200" ] && [ "$ready_code" = "200" ]; then
              RELEASE="$(jq -r '.release_sha // ""' /tmp/candidate-api-ready.json)"
              DB_HEAD="$(jq -r '.schema_revision // ""' /tmp/candidate-api-ready.json)"
              RUNTIME_HEAD="$(jq -r '.expected_schema_revision // ""' /tmp/candidate-api-ready.json)"
              SCHEMA_MATCHES="$(jq -r '.schema_matches // false' /tmp/candidate-api-ready.json)"
              if [ "$RELEASE" = "${{ github.sha }}" ] \
                && [ "$DB_HEAD" = "$IMAGE_SCHEMA_HEAD" ] \
                && [ "$RUNTIME_HEAD" = "$IMAGE_SCHEMA_HEAD" ] \
                && [ "$SCHEMA_MATCHES" = "true" ]; then
                candidate_ok=true
                break
              fi
            fi
            sleep 3
          done
          if [ "$candidate_ok" != "true" ]; then
            echo "API candidate failed direct HTTP identity/health validation."
            cat /tmp/candidate-api-health.json || true
            cat /tmp/candidate-api-ready.json || true
            exit 1
          fi

          cat /tmp/candidate-api-health.json
          cat /tmp/candidate-api-ready.json
          echo "CREATED_API_REVISION=$CREATED_API_REVISION" >> "$GITHUB_ENV"
          echo "API_CANDIDATE_URL=$CANDIDATE_URL" >> "$GITHUB_ENV"

      - name: Promote exact validated API revision to 100 percent
        run: |
          set -euo pipefail
          echo "API_CUTOVER_STARTED=true" >> "$GITHUB_ENV"
          gcloud run services update-traffic "${{ env.API_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --to-revisions "$CREATED_API_REVISION=100" \
            --quiet

          for attempt in $(seq 1 20); do
            SERVICE_JSON="$(gcloud run services describe "${{ env.API_SERVICE }}" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --region "${{ env.REGION }}" \
              --format=json)"
            ACTIVE_100="$(printf '%s' "$SERVICE_JSON" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName][0] // ""')"
            [ "$ACTIVE_100" = "$CREATED_API_REVISION" ] && exit 0
            sleep 3
          done
          echo "Validated API candidate never received 100% production traffic."
          exit 1

      - name: Verify production API identity
        id: verify_production
        run: |
          set -euo pipefail
          production_ok=false
          for attempt in $(seq 1 30); do
            SERVICE_JSON="$(gcloud run services describe "${{ env.API_SERVICE }}" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --region "${{ env.REGION }}" \
              --format=json)"
            ACTIVE_100="$(printf '%s' "$SERVICE_JSON" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName][0] // ""')"
            health_code="$(curl -sS -o /tmp/production-api-health.json -w '%{http_code}' "${{ env.PRODUCTION_API_URL }}/health" || true)"
            ready_code="$(curl -sS -o /tmp/production-api-ready.json -w '%{http_code}' "${{ env.PRODUCTION_API_URL }}/health/ready" || true)"
            if [ "$ACTIVE_100" = "$CREATED_API_REVISION" ] && [ "$health_code" = "200" ] && [ "$ready_code" = "200" ]; then
              RELEASE="$(jq -r '.release_sha // ""' /tmp/production-api-ready.json)"
              DB_HEAD="$(jq -r '.schema_revision // ""' /tmp/production-api-ready.json)"
              RUNTIME_HEAD="$(jq -r '.expected_schema_revision // ""' /tmp/production-api-ready.json)"
              SCHEMA_MATCHES="$(jq -r '.schema_matches // false' /tmp/production-api-ready.json)"
              if [ "$RELEASE" = "${{ github.sha }}" ] \
                && [ "$DB_HEAD" = "$IMAGE_SCHEMA_HEAD" ] \
                && [ "$RUNTIME_HEAD" = "$IMAGE_SCHEMA_HEAD" ] \
                && [ "$SCHEMA_MATCHES" = "true" ]; then
                production_ok=true
                break
              fi
            fi
            sleep 6
          done

          if [ "$production_ok" != "true" ]; then
            echo "Production API did not confirm the exact validated revision, release SHA, and schema identity."
            cat /tmp/production-api-health.json || true
            cat /tmp/production-api-ready.json || true
            exit 1
          fi

          cat /tmp/production-api-health.json
          cat /tmp/production-api-ready.json
          echo "Production API exact revision, release SHA, and schema identity verified."
          echo "url=$API_SERVICE_URL" >> "$GITHUB_OUTPUT"
          gcloud run services update-traffic "${{ env.API_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --remove-tags "$API_CANDIDATE_TAG" \
            --quiet || true

      - name: Restore previous API traffic after failed cutover
        if: ${{ failure() && env.API_CUTOVER_STARTED == 'true' }}
        run: |
          set +e
          echo "API cutover failed verification. Restoring application traffic to $PREVIOUS_API_REVISION."
          gcloud run services update-traffic "${{ env.API_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --to-revisions "$PREVIOUS_API_REVISION=100" \
            --quiet
          rollback_command_status=$?

          rollback_ok=false
          for attempt in $(seq 1 20); do
            SERVICE_JSON="$(gcloud run services describe "${{ env.API_SERVICE }}" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --region "${{ env.REGION }}" \
              --format=json 2>/dev/null)"
            ACTIVE_100="$(printf '%s' "$SERVICE_JSON" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName][0] // ""' 2>/dev/null)"
            if [ "$ACTIVE_100" = "$PREVIOUS_API_REVISION" ]; then rollback_ok=true; break; fi
            sleep 3
          done
          echo "API rollback command status=$rollback_command_status traffic_confirmed=$rollback_ok"
          curl -sS "${{ env.PRODUCTION_API_URL }}/health" || true
          curl -sS "${{ env.PRODUCTION_API_URL }}/health/ready" || true
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${{ env.API_SERVICE }}\" AND resource.labels.revision_name=\"$CREATED_API_REVISION\"" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --limit 200 \
            --order=asc \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
          gcloud run services update-traffic "${{ env.API_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --remove-tags "$API_CANDIDATE_TAG" \
            --quiet || true
          echo "Alembic migrations were intentionally NOT reversed; application rollback assumes backward compatibility with the immediately previous API revision."
          [ "$rollback_command_status" -eq 0 ] && [ "$rollback_ok" = "true" ]

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push immutable production web image
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/buyer-dash/${{ env.WEB_SERVICE }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_URL=${{ env.PRODUCTION_API_URL }} \
            --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }} \
            --build-arg VITE_RELEASE_SHA=${{ github.sha }} \
            -t "$IMAGE" \
            frontend
          docker push "$IMAGE"
          IMAGE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project "${{ secrets.GCP_PROJECT_ID }}" --format='value(image_summary.digest)')"
          test -n "$IMAGE_DIGEST"
          echo "Web image digest: $IMAGE_DIGEST"
          echo "WEB_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "WEB_IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Capture and preflight currently healthy production web revision
        run: |
          set -euo pipefail
          SERVICE_JSON="$(gcloud run services describe "${{ env.WEB_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --format=json)"
          PREVIOUS_WEB_REVISION="$(printf '%s' "$SERVICE_JSON" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName][0] // ""')"
          test -n "$PREVIOUS_WEB_REVISION"

          public_code="$(curl -sS -L -o /tmp/pre-public.html -w '%{http_code}' https://doobielogic.io || true)"
          ops_code="$(curl -sS -L -o /tmp/pre-ops.html -w '%{http_code}' https://ops.doobielogic.io || true)"
          if [ "$public_code" != "200" ] || [ "$ops_code" != "200" ]; then
            echo "Refusing deployment because the current production web revision is not healthy (public=$public_code ops=$ops_code)."
            exit 1
          fi

          echo "Previous healthy web revision: $PREVIOUS_WEB_REVISION"
          echo "PREVIOUS_WEB_REVISION=$PREVIOUS_WEB_REVISION" >> "$GITHUB_ENV"

      - name: Deploy frontend candidate without traffic
        run: |
          set -euo pipefail
          WEB_CANDIDATE_TAG="web-candidate-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "WEB_CANDIDATE_TAG=$WEB_CANDIDATE_TAG" >> "$GITHUB_ENV"
          gcloud run deploy "${{ env.WEB_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --image "$WEB_IMAGE" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --no-traffic \
            --tag "$WEB_CANDIDATE_TAG" \
            --port 8080 \
            --min-instances 1 \
            --max-instances 10 \
            --service-account="${{ secrets.GCP_SERVICE_ACCOUNT }}" \
            --quiet

      - name: Verify exact frontend candidate revision and HTTP identity
        run: |
          set -euo pipefail

          dump_candidate_logs() {
            if [ -n "${CREATED_WEB_REVISION:-}" ]; then
              echo "=== Web candidate revision ==="
              gcloud run revisions describe "$CREATED_WEB_REVISION" \
                --project "${{ secrets.GCP_PROJECT_ID }}" \
                --region "${{ env.REGION }}" \
                --format='yaml(metadata.name,spec.containers,status.conditions)' || true
              echo "=== Web candidate logs ==="
              gcloud logging read \
                "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${{ env.WEB_SERVICE }}\" AND resource.labels.revision_name=\"$CREATED_WEB_REVISION\"" \
                --project "${{ secrets.GCP_PROJECT_ID }}" \
                --limit 200 \
                --order=asc \
                --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
            fi
          }
          trap 'status=$?; if [ "$status" -ne 0 ]; then dump_candidate_logs; fi' EXIT

          SERVICE_JSON="$(gcloud run services describe "${{ env.WEB_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --format=json)"
          CREATED_WEB_REVISION="$(printf '%s' "$SERVICE_JSON" | jq -r '.status.latestCreatedRevisionName // ""')"
          test -n "$CREATED_WEB_REVISION"
          if [ "$CREATED_WEB_REVISION" = "$PREVIOUS_WEB_REVISION" ]; then
            echo "Refusing cutover: Cloud Run did not create a new web revision."
            exit 1
          fi

          CANDIDATE_REVISION=""
          CANDIDATE_URL=""
          for attempt in $(seq 1 20); do
            SERVICE_JSON="$(gcloud run services describe "${{ env.WEB_SERVICE }}" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --region "${{ env.REGION }}" \
              --format=json)"
            CANDIDATE_REVISION="$(printf '%s' "$SERVICE_JSON" | jq -r --arg tag "$WEB_CANDIDATE_TAG" '[.status.traffic[]? | select(.tag == $tag) | .revisionName][0] // ""')"
            CANDIDATE_URL="$(printf '%s' "$SERVICE_JSON" | jq -r --arg tag "$WEB_CANDIDATE_TAG" '[.status.traffic[]? | select(.tag == $tag) | .url][0] // ""')"
            if [ "$CANDIDATE_REVISION" = "$CREATED_WEB_REVISION" ] && [ -n "$CANDIDATE_URL" ]; then break; fi
            sleep 3
          done
          if [ "$CANDIDATE_REVISION" != "$CREATED_WEB_REVISION" ] || [ -z "$CANDIDATE_URL" ]; then
            echo "Refusing cutover: the candidate tag does not resolve to the exact newly created web revision."
            exit 1
          fi

          gcloud run revisions describe "$CREATED_WEB_REVISION" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --format=json > /tmp/web-candidate-revision.json
          READY_STATUS="$(jq -r '[.status.conditions[]? | select(.type == "Ready") | .status][0] // ""' /tmp/web-candidate-revision.json)"
          REV_IMAGE="$(jq -r '.spec.containers[0].image // ""' /tmp/web-candidate-revision.json)"
          echo "candidate=$CREATED_WEB_REVISION ready=$READY_STATUS image=$REV_IMAGE"
          [ "$READY_STATUS" = "True" ] || { echo "Web candidate is not Ready."; exit 1; }
          case "$REV_IMAGE" in
            *@"$WEB_IMAGE_DIGEST") ;;
            *) echo "Web candidate is not running the image digest built by this workflow."; exit 1 ;;
          esac

          candidate_ok=false
          for attempt in $(seq 1 20); do
            health_code="$(curl -sS -o /tmp/candidate-web-health.txt -w '%{http_code}' "$CANDIDATE_URL/health" || true)"
            release_code="$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/candidate-web-release.json -w '%{http_code}' "$CANDIDATE_URL/release.json?run=${{ github.run_id }}-${{ github.run_attempt }}" || true)"
            RELEASE="$(jq -r '.release_sha // ""' /tmp/candidate-web-release.json 2>/dev/null || true)"
            if [ "$health_code" = "200" ] && [ "$release_code" = "200" ] && [ "$RELEASE" = "${{ github.sha }}" ]; then
              candidate_ok=true
              break
            fi
            sleep 3
          done
          if [ "$candidate_ok" != "true" ]; then
            echo "Web candidate failed direct HTTP release-identity validation."
            cat /tmp/candidate-web-health.txt || true
            cat /tmp/candidate-web-release.json || true
            exit 1
          fi

          echo "CREATED_WEB_REVISION=$CREATED_WEB_REVISION" >> "$GITHUB_ENV"
          echo "WEB_CANDIDATE_URL=$CANDIDATE_URL" >> "$GITHUB_ENV"

      - name: Promote exact validated frontend revision to 100 percent
        run: |
          set -euo pipefail
          echo "WEB_CUTOVER_STARTED=true" >> "$GITHUB_ENV"
          gcloud run services update-traffic "${{ env.WEB_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --to-revisions "$CREATED_WEB_REVISION=100" \
            --quiet

          for attempt in $(seq 1 20); do
            SERVICE_JSON="$(gcloud run services describe "${{ env.WEB_SERVICE }}" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --region "${{ env.REGION }}" \
              --format=json)"
            ACTIVE_100="$(printf '%s' "$SERVICE_JSON" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName][0] // ""')"
            [ "$ACTIVE_100" = "$CREATED_WEB_REVISION" ] && exit 0
            sleep 3
          done
          echo "Validated web candidate never received 100% production traffic."
          exit 1

      - name: Verify both production web domains and exact revision
        run: |
          set -euo pipefail
          production_ok=false
          for attempt in $(seq 1 30); do
            SERVICE_JSON="$(gcloud run services describe "${{ env.WEB_SERVICE }}" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --region "${{ env.REGION }}" \
              --format=json)"
            ACTIVE_100="$(printf '%s' "$SERVICE_JSON" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName][0] // ""')"
            public_code="$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/public-release.json -w '%{http_code}' "https://doobielogic.io/release.json?run=${{ github.run_id }}-${{ github.run_attempt }}" || true)"
            ops_code="$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/ops-release.json -w '%{http_code}' "https://ops.doobielogic.io/release.json?run=${{ github.run_id }}-${{ github.run_attempt }}" || true)"
            PUBLIC_RELEASE="$(jq -r '.release_sha // ""' /tmp/public-release.json 2>/dev/null || true)"
            OPS_RELEASE="$(jq -r '.release_sha // ""' /tmp/ops-release.json 2>/dev/null || true)"
            if [ "$ACTIVE_100" = "$CREATED_WEB_REVISION" ] \
              && [ "$public_code" = "200" ] && [ "$ops_code" = "200" ] \
              && [ "$PUBLIC_RELEASE" = "${{ github.sha }}" ] \
              && [ "$OPS_RELEASE" = "${{ github.sha }}" ]; then
              production_ok=true
              break
            fi
            sleep 6
          done

          if [ "$production_ok" != "true" ]; then
            echo "Production web did not confirm the exact validated revision and release SHA on both domains."
            cat /tmp/public-release.json || true
            cat /tmp/ops-release.json || true
            exit 1
          fi

          echo "doobielogic.io release: $PUBLIC_RELEASE"
          echo "ops.doobielogic.io release: $OPS_RELEASE"
          echo "Both production web domains and Cloud Run traffic confirm the exact current commit."
          gcloud run services update-traffic "${{ env.WEB_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --remove-tags "$WEB_CANDIDATE_TAG" \
            --quiet || true

      - name: Restore previous web traffic after failed cutover
        if: ${{ failure() && env.WEB_CUTOVER_STARTED == 'true' }}
        run: |
          set +e
          echo "Web cutover failed verification. Restoring traffic to $PREVIOUS_WEB_REVISION."
          gcloud run services update-traffic "${{ env.WEB_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --to-revisions "$PREVIOUS_WEB_REVISION=100" \
            --quiet
          rollback_command_status=$?

          rollback_ok=false
          for attempt in $(seq 1 20); do
            SERVICE_JSON="$(gcloud run services describe "${{ env.WEB_SERVICE }}" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --region "${{ env.REGION }}" \
              --format=json 2>/dev/null)"
            ACTIVE_100="$(printf '%s' "$SERVICE_JSON" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName][0] // ""' 2>/dev/null)"
            if [ "$ACTIVE_100" = "$PREVIOUS_WEB_REVISION" ]; then rollback_ok=true; break; fi
            sleep 3
          done
          echo "Web rollback command status=$rollback_command_status traffic_confirmed=$rollback_ok"
          curl -sS -L https://doobielogic.io/ >/dev/null || true
          curl -sS -L https://ops.doobielogic.io/ >/dev/null || true
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${{ env.WEB_SERVICE }}\" AND resource.labels.revision_name=\"$CREATED_WEB_REVISION\"" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --limit 200 \
            --order=asc \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
          gcloud run services update-traffic "${{ env.WEB_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --remove-tags "$WEB_CANDIDATE_TAG" \
            --quiet || true
          [ "$rollback_command_status" -eq 0 ] && [ "$rollback_ok" = "true" ]
