name: Deploy to DoobieLogic

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: us-east1-docker.pkg.dev
  API_SERVICE: buyer-dash-api
  WEB_SERVICE: buyer-dash-web
  MIGRATION_JOB: buyer-dash-migrate
  REGION: us-east1
  PRODUCTION_API_URL: https://api.doobielogic.io
  API_MAX_INSTANCES: 3
  DATABASE_POOL_SIZE: 2
  SUPABASE_SESSION_LIMIT: 15
  SUPABASE_SESSION_HEADROOM: 3

jobs:
  parity-release-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Block incomplete Streamlit parity from production
        run: python scripts/verify_streamlit_parity.py --mode release
      - name: Verify production API image builds
        run: docker build -f Dockerfile.api -t doobielogic-api-release-check .
      - name: Verify API image has exactly one Alembic head
        run: |
          set -euo pipefail
          HEADS="$(docker run --rm doobielogic-api-release-check alembic heads)"
          echo "$HEADS"
          HEAD_COUNT="$(printf '%s\n' "$HEADS" | grep -c '(head)' || true)"
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "Expected exactly one Alembic head; found $HEAD_COUNT"
            exit 1
          fi
      - name: Verify Supabase session budget
        run: |
          set -euo pipefail
          STEADY=$(( DATABASE_POOL_SIZE * API_MAX_INSTANCES ))
          ROLLING=$(( STEADY * 2 ))
          SAFE=$(( SUPABASE_SESSION_LIMIT - SUPABASE_SESSION_HEADROOM ))
          echo "steady-state sessions <= $STEADY; rolling-revision worst case <= $ROLLING; safe budget = $SAFE"
          if [ "$ROLLING" -gt "$SAFE" ]; then
            echo "Refusing deployment: configured API pool/scale can exceed the reserved Supabase session budget"
            exit 1
          fi

  deploy-api:
    needs: parity-release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      api_url: ${{ steps.promote.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build, identify, and push production API image
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/buyer-dash/${{ env.API_SERVICE }}:${{ github.sha }}"
          docker build -f Dockerfile.api \
            -t "$IMAGE" \
            -t "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/buyer-dash/${{ env.API_SERVICE }}:latest" \
            .

          HEADS="$(docker run --rm "$IMAGE" alembic heads)"
          echo "$HEADS"
          HEAD_COUNT="$(printf '%s\n' "$HEADS" | grep -c '(head)' || true)"
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "Refusing deployment: API image has $HEAD_COUNT Alembic heads"
            exit 1
          fi
          IMAGE_SCHEMA_HEAD="$(printf '%s\n' "$HEADS" | awk 'NR==1 {print $1}')"
          test -n "$IMAGE_SCHEMA_HEAD"
          echo "API image schema head: $IMAGE_SCHEMA_HEAD"

          docker push "$IMAGE"
          docker push "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/buyer-dash/${{ env.API_SERVICE }}:latest"
          echo "API_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_SCHEMA_HEAD=$IMAGE_SCHEMA_HEAD" >> "$GITHUB_ENV"

      - name: Run production database migrations
        run: |
          set -euo pipefail
          gcloud run jobs deploy "${{ env.MIGRATION_JOB }}" \
            --image "$API_IMAGE" \
            --region "${{ env.REGION }}" \
            --service-account "buyer-dash-migrate@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --command alembic \
            --args upgrade,head \
            --max-retries 0 \
            --task-timeout 15m \
            --set-env-vars APP_ENV=production \
            --set-secrets DATABASE_URL=buyer-dash-database-url:latest \
            --quiet
          gcloud run jobs execute "${{ env.MIGRATION_JOB }}" \
            --region "${{ env.REGION }}" \
            --wait

      - name: Deploy API candidate without traffic
        run: |
          set -euo pipefail
          gcloud run deploy "${{ env.API_SERVICE }}" \
            --image "$API_IMAGE" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --service-account "buyer-dash-api@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --no-traffic \
            --port 8080 \
            --min-instances 1 \
            --max-instances "${{ env.API_MAX_INSTANCES }}" \
            --concurrency 40 \
            --cpu 1 \
            --memory 1Gi \
            --set-env-vars "^@^APP_ENV=production@CORS_ORIGINS=https://ops.doobielogic.io@ALLOWED_HOSTS=api.doobielogic.io,*.run.app@DATABASE_POOL_SIZE=${{ env.DATABASE_POOL_SIZE }}@DATABASE_MAX_OVERFLOW=0@DATABASE_POOL_TIMEOUT=30@RELEASE_SHA=${{ github.sha }}@EXPECTED_SCHEMA_HEAD=$IMAGE_SCHEMA_HEAD" \
            --set-secrets "DATABASE_URL=buyer-dash-database-url:latest,SUPABASE_URL=buyer-dash-supabase-url:latest,SUPABASE_JWKS_URL=buyer-dash-supabase-jwks-url:latest,SUPABASE_SERVICE_ROLE_KEY=buyer-dash-supabase-service-role:latest,INTEGRATION_ENCRYPTION_KEY=buyer-dash-integration-encryption-key:latest" \
            --quiet

      - name: Verify candidate identity and promote to 100 percent
        id: promote
        run: |
          set -euo pipefail
          SERVICE_JSON="$(gcloud run services describe "${{ env.API_SERVICE }}" --region "${{ env.REGION }}" --format=json)"
          SERVICE_URL="$(printf '%s' "$SERVICE_JSON" | jq -r '.status.url')"
          CREATED_REVISION="$(printf '%s' "$SERVICE_JSON" | jq -r '.status.latestCreatedRevisionName')"
          test -n "$CREATED_REVISION"
          echo "Created revision: $CREATED_REVISION"

          gcloud run revisions describe "$CREATED_REVISION" --region "${{ env.REGION }}" --format=json > /tmp/revision.json
          READY_STATUS="$(jq -r '[.status.conditions[]? | select(.type == "Ready") | .status][0] // ""' /tmp/revision.json)"
          REV_RELEASE="$(jq -r '[.spec.containers[0].env[]? | select(.name == "RELEASE_SHA") | .value][0] // ""' /tmp/revision.json)"
          REV_SCHEMA="$(jq -r '[.spec.containers[0].env[]? | select(.name == "EXPECTED_SCHEMA_HEAD") | .value][0] // ""' /tmp/revision.json)"
          echo "ready=$READY_STATUS release=$REV_RELEASE schema=$REV_SCHEMA"

          if [ "$READY_STATUS" != "True" ]; then
            jq '.status.conditions' /tmp/revision.json || true
            gcloud logging read \
              "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${{ env.API_SERVICE }}\" AND resource.labels.revision_name=\"$CREATED_REVISION\"" \
              --limit 150 \
              --order=asc \
              --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
            exit 1
          fi
          if [ "$REV_RELEASE" != "${{ github.sha }}" ]; then
            echo "Refusing cutover: candidate release SHA does not match"
            exit 1
          fi
          if [ "$REV_SCHEMA" != "$IMAGE_SCHEMA_HEAD" ]; then
            echo "Refusing cutover: candidate schema head does not match image head"
            exit 1
          fi

          gcloud run services update-traffic "${{ env.API_SERVICE }}" \
            --region "${{ env.REGION }}" \
            --to-revisions "$CREATED_REVISION=100" \
            --quiet

          for attempt in $(seq 1 20); do
            SERVICE_JSON="$(gcloud run services describe "${{ env.API_SERVICE }}" --region "${{ env.REGION }}" --format=json)"
            ACTIVE_100="$(printf '%s' "$SERVICE_JSON" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName][0] // ""')"
            if [ "$ACTIVE_100" = "$CREATED_REVISION" ]; then
              echo "Production traffic is 100% on $CREATED_REVISION"
              echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "Refusing cutover: candidate never received 100% traffic"
          exit 1

      - name: Verify production release and schema identity
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "${{ env.PRODUCTION_API_URL }}/health" || true)
            ready_code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' "${{ env.PRODUCTION_API_URL }}/health/ready" || true)
            if [ "$health_code" = "200" ] && [ "$ready_code" = "200" ]; then
              RELEASE="$(jq -r '.release_sha // ""' /tmp/ready.json)"
              DB_HEAD="$(jq -r '.schema_revision // ""' /tmp/ready.json)"
              RUNTIME_HEAD="$(jq -r '.expected_schema_revision // ""' /tmp/ready.json)"
              SCHEMA_MATCHES="$(jq -r '.schema_matches // false' /tmp/ready.json)"
              if [ "$RELEASE" = "${{ github.sha }}" ] \
                && [ "$DB_HEAD" = "$IMAGE_SCHEMA_HEAD" ] \
                && [ "$RUNTIME_HEAD" = "$IMAGE_SCHEMA_HEAD" ] \
                && [ "$SCHEMA_MATCHES" = "true" ]; then
                cat /tmp/health.json
                cat /tmp/ready.json
                echo "Release SHA and schema identity verified"
                exit 0
              fi
            fi
            echo "API identity not ready yet (health=$health_code ready=$ready_code); retrying..."
            sleep 6
          done
          echo "API failed release/schema identity verification"
          cat /tmp/health.json || true
          cat /tmp/ready.json || true
          exit 1

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push production web image
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/buyer-dash/${{ env.WEB_SERVICE }}:${{ github.sha }}"
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_URL=${{ env.PRODUCTION_API_URL }} \
            --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }} \
            -t "$IMAGE" \
            -t "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/buyer-dash/${{ env.WEB_SERVICE }}:latest" \
            frontend
          docker push "$IMAGE"
          docker push "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/buyer-dash/${{ env.WEB_SERVICE }}:latest"
          echo "WEB_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy frontend to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "${{ env.WEB_SERVICE }}" \
            --image "$WEB_IMAGE" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 1 \
            --max-instances 10 \
            --service-account="${{ secrets.GCP_SERVICE_ACCOUNT }}" \
            --quiet

      - name: Smoke test ops.doobielogic.io
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code=$(curl -sS -L -o /tmp/ops.html -w '%{http_code}' https://ops.doobielogic.io || true)
            if [ "$code" = "200" ]; then
              grep -qi 'DoobieLogic\|Buyer' /tmp/ops.html
              echo "ops.doobielogic.io is serving production"
              exit 0
            fi
            sleep 6
          done
          head -100 /tmp/ops.html || true
          exit 1
