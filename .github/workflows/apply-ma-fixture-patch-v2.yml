name: Apply final MA fixture patch v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-ma-fixture-patch-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply final source and provenance changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Missing expected {label}")
              return text.replace(old, new, 1)

          def replace_section(text: str, start: str, end: str, replacement: str, label: str) -> str:
              try:
                  left = text.index(start)
                  right = text.index(end, left)
              except ValueError as exc:
                  raise SystemExit(f"Missing expected {label}") from exc
              return text[:left] + replacement + text[right:]

          # 1. Make every seeded flower strain an exact Massachusetts reference strain and
          # remove the synthetic flower QA generator entirely.
          scale_path = Path("modules/coman/vertical_demo_inventory_scale.py")
          scale = scale_path.read_text()
          old_strains = (
              'STRAINS = (\n'
              '    "Gastro Pop",\n'
              '    "GMO",\n'
              '    "Strawberry Cough",\n'
              '    "Blue Dream",\n'
              '    "Wedding Cake",\n'
              '    "Super Lemon Haze",\n'
              '    "Gelato 41",\n'
              '    "Motorbreath",\n'
              '    "Permanent Marker",\n'
              '    "Animal Face",\n'
              ')'
          )
          new_strains = (
              'STRAINS = (\n'
              '    "Candy Sparqs",\n'
              '    "GMO",\n'
              '    "Strawberry Cough",\n'
              '    "Blue Dream",\n'
              '    "Wedding Cake",\n'
              '    "Super Lemon Haze",\n'
              '    "Runtz OG",\n'
              '    "Motorbreath",\n'
              '    "Permanent Marker",\n'
              '    "Animal Tsunami",\n'
              ')'
          )
          scale = replace_once(scale, old_strains, new_strains, "STRAINS block")
          scale = replace_once(
              scale,
              'from modules.coman.vertical_demo_ma_coas import (\n'
              '    annotate_dev_flower_label_metadata,\n'
              '    seed_dev_ma_flower_reference_coa,\n'
              ')',
              'from modules.coman.vertical_demo_ma_coas import (\n'
              '    MA_FLOWER_REFERENCE_STRAINS,\n'
              '    annotate_dev_flower_label_metadata,\n'
              '    seed_dev_ma_flower_reference_coa,\n'
              ')',
              "MA fixture imports",
          )
          guard_marker = '    coman = ComanRepository(engine)\n    master = ProductMasterRepository(engine)'
          guard = (
              '    if set(STRAINS) != set(MA_FLOWER_REFERENCE_STRAINS):\n'
              '        missing = sorted(set(STRAINS) - set(MA_FLOWER_REFERENCE_STRAINS))\n'
              '        extra = sorted(set(MA_FLOWER_REFERENCE_STRAINS) - set(STRAINS))\n'
              '        raise RuntimeError(\n'
              '            f"DEV MA flower reference coverage mismatch: missing={missing} extra={extra}"\n'
              '        )\n\n'
              '    coman = ComanRepository(engine)\n'
              '    master = ProductMasterRepository(engine)'
          )
          scale = replace_once(scale, guard_marker, guard, "fixture coverage guard location")
          synthetic = (
              '        _quality(engine, flower_lot_id, f"DEV-COA-{generation}-{code}-FLOWER", '
              'thca=25.0 + strain_index * 0.35, tac=28.0 + strain_index * 0.30, '
              'terpenes=1.7 + strain_index * 0.11, source="dev_vertical_harvest_lab", actor=actor)\n'
          )
          scale = replace_once(scale, synthetic, "", "synthetic flower QA call")
          scale_path.write_text(scale)

          # 2. Merge the four final exact MA references and make the external document
          # impossible to resolve as if it directly tested the sandbox package.
          fixture_path = Path("modules/coman/vertical_demo_ma_coas.py")
          fixture = fixture_path.read_text()
          fixture = replace_once(
              fixture,
              'from typing import Any\n\nfrom sqlalchemy import select',
              'from typing import Any\n\n'
              'from modules.coman.vertical_demo_ma_coa_references import ADDITIONAL_MA_FLOWER_COA_FIXTURES\n'
              'from sqlalchemy import select',
              "additional fixture import",
          )
          fixture = replace_once(
              fixture,
              '\nMA_FLOWER_REFERENCE_STRAINS = frozenset(MA_FLOWER_COA_FIXTURES)',
              '\nMA_FLOWER_COA_FIXTURES.update(deepcopy(ADDITIONAL_MA_FLOWER_COA_FIXTURES))\n\n'
              'MA_FLOWER_REFERENCE_STRAINS = frozenset(MA_FLOWER_COA_FIXTURES)',
              "additional fixture merge",
          )
          fixture = replace_once(
              fixture,
              ') -> CoaDocument | None:\n    """Replace synthetic root QA with one source-provenanced MA flower fixture when available."""',
              ') -> CoaDocument:\n    """Attach one exact-name external MA flower reference without rewriting sandbox identity."""',
              "seed helper signature",
          )
          fixture = replace_once(
              fixture,
              '    fixture = MA_FLOWER_COA_FIXTURES.get(strain)\n'
              '    if fixture is None:\n'
              '        return None',
              '    fixture = MA_FLOWER_COA_FIXTURES.get(strain)\n'
              '    if fixture is None:\n'
              '        raise RuntimeError(\n'
              '            f"No verified Massachusetts flower reference fixture exists for DEV strain {strain!r}."\n'
              '        )',
              "missing fixture behavior",
          )
          mapping_start = '        raw["sandbox_mapping"] = {'
          normalization_start = '        raw["normalization_schema"] = {'
          mapping = (
              '        raw["sandbox_mapping"] = {\n'
              '            "purpose": "DEV Sandbox matching-strain external reference fixture",\n'
              '            "mapping_type": "strain_match_external_reference",\n'
              '            "external_reference_only": True,\n'
              '            "sandbox_lot_id": lot.id,\n'
              '            "current_sandbox_package_id": lot.compliance_package_id,\n'
              '            "sandbox_release_state": "Passed (DEV simulation only)",\n'
              '            "sandbox_release_basis": (\n'
              '                "DEV scenario state; external source COA does not certify the sandbox package"\n'
              '            ),\n'
              '            "source_tracking_id": raw.get("metrc_source_id") or "",\n'
              '            "source_sample_metrc_tag": raw.get("metrc_lab_id") or "",\n'
              '            "identity_rule": (\n'
              '                "sandbox package remains current physical package identity; source COA identifiers "\n'
              '                "remain external tested-material reference and must never resolve as a direct package COA"\n'
              '            ),\n'
              '        }\n'
          )
          fixture = replace_section(fixture, mapping_start, normalization_start, mapping, "sandbox mapping block")
          fixture = replace_once(
              fixture,
              '                lot_id=lot.id,\n'
              '                package_id=package_id,\n'
              '                source=DEV_MA_COA_SOURCE,\n'
              '                status="parsed",\n'
              '                verification_state="operator_confirmed",',
              '                lot_id=None,\n'
              '                package_id="",\n'
              '                source=DEV_MA_COA_SOURCE,\n'
              '                status="parsed",\n'
              '                verification_state="external_reference",',
              "external document identity fields",
          )
          fixture = replace_once(
              fixture,
              '                overall_status=str(raw.get("overall_status") or "pass"),',
              '                overall_status=str(raw.get("overall_status") or ""),',
              "source overall-status default",
          )
          fixture = replace_once(
              fixture,
              '            coa_reference=document.lab_id or document.batch_number or document.filename,',
              '            coa_reference=(\n'
              '                document.lab_id or document.batch_number or str(raw.get("source_record_id") or "") or document.filename\n'
              '            ),',
              "external reference identifier",
          )
          fixture = replace_once(
              fixture,
              '            coa_url=f"/api/v1/label-printing/coas/{document.id}/file",',
              '            coa_url=_source_url(raw),',
              "external reference URL",
          )
          child_marker = (
              '            meta = _metadata(lot)\n'
              '            package_date = lot.received_at.date().isoformat() if lot.received_at else ""'
          )
          child_rewrite = (
              '            if root_quality is None or root_quality.evidence_source != DEV_MA_COA_EVIDENCE:\n'
              '                raise RuntimeError("DEV flower child is missing the exact external MA root reference.")\n'
              '            LotQualityService.set_evidence(\n'
              '                session,\n'
              '                lot_id=lot.id,\n'
              '                lab_testing_state=root_quality.lab_testing_state,\n'
              '                coa_reference=root_quality.coa_reference,\n'
              '                coa_url=root_quality.coa_url,\n'
              '                coa_document_id=root_quality.coa_document_id,\n'
              '                thca_percent=root_quality.thca_percent,\n'
              '                tac_percent=root_quality.tac_percent,\n'
              '                total_thc_percent=root_quality.total_thc_percent,\n'
              '                total_cbd_percent=root_quality.total_cbd_percent,\n'
              '                total_cannabinoids_percent=root_quality.total_cannabinoids_percent,\n'
              '                total_terpenes_percent=root_quality.total_terpenes_percent,\n'
              '                evidence_source=DEV_MA_INHERITED_EVIDENCE,\n'
              '                inherited_from_lot_id=root.id,\n'
              '                actor="dev-sandbox:ma-reference-lineage",\n'
              '            )\n'
              '            meta = _metadata(lot)\n'
              '            package_date = lot.received_at.date().isoformat() if lot.received_at else ""'
          )
          fixture = replace_once(fixture, child_marker, child_rewrite, "flower child provenance annotation")
          fixture_path.write_text(fixture)

          # 3. Strengthen acceptance tests around all ten references and the identity boundary.
          test_path = Path("tests/test_dev_sandbox_vertical_inventory.py")
          test = test_path.read_text()
          test = replace_once(
              test,
              'from modules.coman.vertical_demo_ma_coas import (\n'
              '    DEV_MA_COA_SOURCE,\n'
              '    EXPECTED_MA_FLOWER_REFERENCE_COAS,\n'
              ')',
              'from modules.coman.vertical_demo_ma_coas import (\n'
              '    DEV_MA_COA_EVIDENCE,\n'
              '    DEV_MA_COA_SOURCE,\n'
              '    DEV_MA_INHERITED_EVIDENCE,\n'
              '    EXPECTED_MA_FLOWER_REFERENCE_COAS,\n'
              '    MA_FLOWER_REFERENCE_STRAINS,\n'
              ')',
              "test fixture imports",
          )
          ma_start = '        assert len(ma_documents) == EXPECTED_MA_FLOWER_REFERENCE_COAS == 6'
          ma_end = '        super_lemon = next(row for row in ma_documents if row.strain_name == "Super Lemon Haze")'
          ma_block = (
              '        assert len(ma_documents) == EXPECTED_MA_FLOWER_REFERENCE_COAS == 10\n'
              '        assert {row.strain_name for row in ma_documents} == set(MA_FLOWER_REFERENCE_STRAINS) == {\n'
              '            "Animal Tsunami",\n'
              '            "Blue Dream",\n'
              '            "Candy Sparqs",\n'
              '            "GMO",\n'
              '            "Motorbreath",\n'
              '            "Permanent Marker",\n'
              '            "Runtz OG",\n'
              '            "Strawberry Cough",\n'
              '            "Super Lemon Haze",\n'
              '            "Wedding Cake",\n'
              '        }\n'
              '        for document in ma_documents:\n'
              '            raw = json.loads(document.raw_payload_json)\n'
              '            assert raw["source_state"] == "MA"\n'
              '            assert raw["sandbox_mapping"]["mapping_type"] == "strain_match_external_reference"\n'
              '            assert raw["sandbox_mapping"]["external_reference_only"] is True\n'
              '            assert "does not certify the sandbox package" in raw["sandbox_mapping"]["sandbox_release_basis"]\n'
              '            assert document.package_id == ""\n'
              '            assert document.lot_id is None\n'
              '            assert document.verification_state == "external_reference"\n'
              '            if document.strain_name == "Strawberry Cough":\n'
              '                assert document.overall_status == ""\n'
              '                assert raw["source_safety_verified"] is False\n'
              '                assert document.metrc_source_id == ""\n'
              '                assert document.lab_id == ""\n'
              '            else:\n'
              '                assert document.overall_status == "pass"\n'
              '            if document.strain_name in {"Animal Tsunami", "Runtz OG"}:\n'
              '                assert raw["source_safety_verified"] is False\n'
              '            if document.strain_name == "Candy Sparqs":\n'
              '                assert raw["source_safety_verified"] is True\n\n'
          )
          test = replace_section(test, ma_start, ma_end, ma_block, "MA document acceptance block")
          flower_marker = '        assert len(flower_lots) == 350\n        for lot in flower_lots:'
          flower_block = (
              '        assert len(flower_lots) == 350\n'
              '        flower_quality = [session.get(LotQualityEvidence, lot.id) for lot in flower_lots]\n'
              '        assert all(row is not None for row in flower_quality)\n'
              '        assert all(\n'
              '            row.evidence_source == DEV_MA_INHERITED_EVIDENCE\n'
              '            for row in flower_quality\n'
              '            if row is not None\n'
              '        )\n'
              '        assert all(row.coa_document_id for row in flower_quality if row is not None)\n'
              '        assert all("example.invalid" not in row.coa_url for row in flower_quality if row is not None)\n'
              '        for lot in flower_lots:'
          )
          test = replace_once(test, flower_marker, flower_block, "350-flower provenance assertions")
          blue_start = '        assert blue_document is not None\n'
          blue_end = '        old_lot_row = session.get(InventoryLot, old_lot.id)'
          blue_block = (
              '        assert blue_document is not None\n'
              '        assert blue_root_quality.evidence_source == DEV_MA_COA_EVIDENCE\n'
              '        assert blue_child_quality.evidence_source == DEV_MA_INHERITED_EVIDENCE\n'
              '        assert blue_document.package_id == ""\n'
              '        assert blue_document.lot_id is None\n'
              '        assert blue_document.verification_state == "external_reference"\n'
              '        assert blue_child.compliance_package_id == "DEV-PKG-GEN1-S04-F01"\n'
              '        assert blue_root.compliance_package_id == "DEV-HARV-GEN1-S04-FLOWER"\n\n'
          )
          test = replace_section(test, blue_start, blue_end, blue_block, "Blue Dream identity assertions")
          test_path.write_text(test)

          # The discovery and self-modifying workflows are workbench-only and must not survive.
          for temporary in (
              Path(".github/workflows/ma-coa-discovery.yml"),
              Path(".github/workflows/opencoa-ma-discovery.yml"),
              Path(".github/workflows/apply-ma-fixture-patch.yml"),
              Path(".github/workflows/apply-ma-fixture-patch-v2.yml"),
          ):
              if temporary.exists():
                  temporary.unlink()
      - name: Static validation
        run: |
          python -m py_compile \
            modules/coman/vertical_demo_inventory_scale.py \
            modules/coman/vertical_demo_ma_coas.py \
            modules/coman/vertical_demo_ma_coa_references.py \
            tests/test_dev_sandbox_vertical_inventory.py
          git diff --check
          ! grep -E '"(Gastro Pop|Gelato 41|Animal Face)"' modules/coman/vertical_demo_inventory_scale.py
          ! grep -F 'dev_vertical_harvest_lab' modules/coman/vertical_demo_inventory_scale.py
          ! grep -F 'verification_state="operator_confirmed"' modules/coman/vertical_demo_ma_coas.py
      - name: Commit and push final patch
        run: |
          git config user.name "DoobieLogic fixture hardening"
          git config user.email "149276571+MAVet710@users.noreply.github.com"
          git add -A
          git commit -m "Finish truthful MA flower reference fixtures"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
