name: Production Runtime Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/production-runtime-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify public API health before Google authentication
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in health health/ready; do
            code=$(curl --silent --show-error --max-time 20 --output "/tmp/${endpoint//\//_}.json" --write-out '%{http_code}' "https://api.doobielogic.io/${endpoint}" || true)
            echo "GET /${endpoint} -> ${code}"
            cat "/tmp/${endpoint//\//_}.json" 2>/dev/null || true
            echo
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Inspect Cloud Run and Secret Manager metadata
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe buyer-dash-api --region us-east1 --format='table(status.latestCreatedRevisionName,status.latestReadyRevisionName,status.url,spec.template.spec.serviceAccountName)'
          echo "API traffic:"
          gcloud run services describe buyer-dash-api --region us-east1 --format='yaml(status.traffic)'
          echo "API environment bindings:"
          gcloud run services describe buyer-dash-api --region us-east1 --format='yaml(spec.template.spec.containers[0].env)'
          echo "Recent API revisions:"
          gcloud run revisions list --service buyer-dash-api --region us-east1 --limit 5 --sort-by='~metadata.creationTimestamp' --format='table(metadata.name,metadata.creationTimestamp,status.conditions[0].status,status.conditions[0].message)'
          echo "DATABASE_URL secret versions:"
          gcloud secrets versions list buyer-dash-database-url --limit=3 --sort-by='~createTime' --format='table(name,state,createTime)'

      - name: Verify Secret Manager DATABASE_URL against production database
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'sqlalchemy>=2,<3' 'psycopg[binary]>=3.1,<4'
          DATABASE_URL="$(gcloud secrets versions access latest --secret=buyer-dash-database-url)"
          export DATABASE_URL
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url = os.environ['DATABASE_URL'].strip()
          if url.startswith('postgres://'):
              url = 'postgresql+psycopg://' + url[len('postgres://'):]
          elif url.startswith('postgresql://'):
              url = 'postgresql+psycopg://' + url[len('postgresql://'):]
          engine = create_engine(url, pool_pre_ping=True)
          with engine.connect() as conn:
              version = conn.execute(text('select version_num from alembic_version')).scalar_one()
              legal_policy = conn.execute(text("select to_regclass('public.legal_policy_versions')")).scalar_one()
              legal_acceptance = conn.execute(text("select to_regclass('public.legal_acceptance_events')")).scalar_one()
              users = conn.execute(text('select count(*) from public.app_users')).scalar_one()
              acceptances = conn.execute(text('select count(*) from public.legal_acceptance_events')).scalar_one()
          print('DATABASE_URL connection: OK')
          print(f'Alembic revision: {version}')
          print(f'Legal policy table: {legal_policy}')
          print(f'Legal acceptance table: {legal_acceptance}')
          print(f'App users: {users}')
          print(f'Legal acceptance rows: {acceptances}')
          PY

      - name: Probe latest revision and promote only if ready
        shell: bash
        run: |
          set -euo pipefail
          latest=$(gcloud run services describe buyer-dash-api --region us-east1 --format='value(status.latestCreatedRevisionName)')
          echo "Latest created revision: $latest"
          gcloud run services update-traffic buyer-dash-api --region us-east1 --update-tags=repair-probe=$latest >/tmp/tag.out
          cat /tmp/tag.out
          service_json=$(gcloud run services describe buyer-dash-api --region us-east1 --format=json)
          probe_url=$(python -c 'import json,sys; d=json.load(sys.stdin); print(next(t["url"] for t in d["status"]["traffic"] if t.get("tag")=="repair-probe"))' <<< "$service_json")
          echo "Probe URL: $probe_url"
          health=$(curl --silent --show-error --max-time 20 --output /tmp/probe-health.json --write-out '%{http_code}' "$probe_url/health" || true)
          ready=$(curl --silent --show-error --max-time 20 --output /tmp/probe-ready.json --write-out '%{http_code}' "$probe_url/health/ready" || true)
          echo "Probe health=$health ready=$ready"
          cat /tmp/probe-health.json || true
          cat /tmp/probe-ready.json || true
          if [ "$health" != "200" ] || [ "$ready" != "200" ]; then
            echo "Latest revision is not ready; production traffic unchanged."
            exit 1
          fi
          echo "Latest revision is healthy; promoting to 100% traffic."
          gcloud run services update-traffic buyer-dash-api --region us-east1 --to-revisions="$latest=100"

      - name: Verify production API after promotion
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            health=$(curl --silent --max-time 20 --output /tmp/health.json --write-out '%{http_code}' https://api.doobielogic.io/health || true)
            ready=$(curl --silent --max-time 20 --output /tmp/ready.json --write-out '%{http_code}' https://api.doobielogic.io/health/ready || true)
            echo "Attempt $attempt: health=$health ready=$ready"
            if [ "$health" = "200" ] && [ "$ready" = "200" ]; then
              cat /tmp/health.json
              cat /tmp/ready.json
              exit 0
            fi
            sleep 3
          done
          cat /tmp/health.json || true
          cat /tmp/ready.json || true
          exit 1
