name: Apply reviewed Extraction candidate
on:
  pull_request:
    paths:
      - '.github/workflows/apply-extraction-candidate.yml'
permissions:
  contents: read
concurrency:
  group: apply-extraction-candidate
  cancel-in-progress: true
jobs:
  apply-reviewed-source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/current-inventory-continuity'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply exactly reviewed source and remove one-shot helper
        run: |
          python scripts/apply_extraction_continuity.py
          sed -i 's/[[:blank:]]*$//' frontend/src/pages/ExtractionUnifiedPage.tsx
          git diff --check
          git add frontend/src/pages/ExtractionUnifiedPage.tsx frontend/src/pages/ExtractionOperatorWorkspace.tsx frontend/src/pages/ExtractionPage.tsx
          git rm scripts/apply_extraction_continuity.py .github/workflows/apply-extraction-candidate.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve exact Extraction run, URL state, scoped detail and preflight isolation'
          git push origin HEAD:refs/heads/codex/current-inventory-continuity
