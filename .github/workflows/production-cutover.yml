name: Production Cutover to DoobieLogic

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

concurrency:
  group: doobielogic-production-cutover
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: us-east1-docker.pkg.dev
  API_SERVICE: buyer-dash-api
  WEB_SERVICE: buyer-dash-web
  MIGRATION_JOB: buyer-dash-migrate
  REGION: us-east1
  PRODUCTION_API_URL: https://api.doobielogic.io

jobs:
  release-gate:
    if: github.event.pull_request.number == 276 && github.event.pull_request.head.ref == 'fix/exact-streamlit-parity-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Streamlit parity contract for live testing
        run: python scripts/verify_streamlit_parity.py
      - name: Verify production API image builds
        run: docker build -f Dockerfile.api -t doobielogic-api-cutover-check .
      - name: Verify API image has exactly one current Alembic head
        run: |
          set -euo pipefail
          HEADS="$(docker run --rm doobielogic-api-cutover-check alembic heads)"
          echo "$HEADS"
          HEAD_COUNT="$(printf '%s\n' "$HEADS" | grep -c '(head)' || true)"
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "Expected exactly one Alembic head in the API image; found $HEAD_COUNT"
            exit 1
          fi
      - name: Verify production API starts
        run: |
          docker run -d --name doobielogic-api-cutover-check \
            -e APP_ENV=development \
            -e DATABASE_URL=sqlite+pysqlite:////tmp/cutover-check.db \
            -e CORS_ORIGINS=https://ops.doobielogic.io \
            -e ALLOWED_HOSTS=api.doobielogic.io,localhost,127.0.0.1 \
            -p 8080:8080 doobielogic-api-cutover-check
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 2
          done
          docker logs doobielogic-api-cutover-check
          exit 1

  deploy-api:
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      api_url: ${{ steps.service-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build, identify, and push production API image
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/buyer-dash/${{ env.API_SERVICE }}:${{ github.event.pull_request.head.sha }}-a${{ github.run_attempt }}"
          docker build -f Dockerfile.api -t "$IMAGE" .

          HEADS="$(docker run --rm "$IMAGE" alembic heads)"
          echo "$HEADS"
          HEAD_COUNT="$(printf '%s\n' "$HEADS" | grep -c '(head)' || true)"
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "Refusing deployment: API image has $HEAD_COUNT Alembic heads"
            exit 1
          fi
          IMAGE_SCHEMA_HEAD="$(printf '%s\n' "$HEADS" | awk 'NR==1 {print $1}')"
          if [ -z "$IMAGE_SCHEMA_HEAD" ]; then
            echo "Unable to determine API image schema head"
            exit 1
          fi
          echo "API image schema head: $IMAGE_SCHEMA_HEAD"

          docker push "$IMAGE"
          echo "API_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_SCHEMA_HEAD=$IMAGE_SCHEMA_HEAD" >> "$GITHUB_ENV"

      - name: Run production database migrations
        run: |
          set -euo pipefail
          gcloud run jobs deploy "${{ env.MIGRATION_JOB }}" \
            --image "$API_IMAGE" \
            --region "${{ env.REGION }}" \
            --service-account "buyer-dash-migrate@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --command alembic \
            --args upgrade,head \
            --max-retries 0 \
            --task-timeout 15m \
            --set-env-vars APP_ENV=production \
            --set-secrets DATABASE_URL=buyer-dash-database-url:latest \
            --quiet
          gcloud run jobs execute "${{ env.MIGRATION_JOB }}" \
            --region "${{ env.REGION }}" \
            --wait

      - name: Deploy uniquely identified production API revision
        run: |
          set -euo pipefail
          SHORT_SHA="$(printf '%s' '${{ github.event.pull_request.head.sha }}' | cut -c1-10)"
          REVISION_SUFFIX="${SHORT_SHA}-a${{ github.run_attempt }}"
          echo "EXPECTED_REVISION_SUFFIX=$REVISION_SUFFIX" >> "$GITHUB_ENV"
          gcloud run deploy "${{ env.API_SERVICE }}" \
            --image "$API_IMAGE" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --revision-suffix "$REVISION_SUFFIX" \
            --service-account "buyer-dash-api@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 1 \
            --max-instances 3 \
            --concurrency 40 \
            --cpu 1 \
            --memory 1Gi \
            --set-env-vars "^@^APP_ENV=production@CORS_ORIGINS=https://ops.doobielogic.io@ALLOWED_HOSTS=api.doobielogic.io,*.run.app@DATABASE_POOL_SIZE=3@DATABASE_MAX_OVERFLOW=0@DATABASE_POOL_TIMEOUT=30@RELEASE_SHA=${{ github.event.pull_request.head.sha }}@EXPECTED_SCHEMA_HEAD=$IMAGE_SCHEMA_HEAD" \
            --set-secrets "DATABASE_URL=buyer-dash-database-url:latest,SUPABASE_URL=buyer-dash-supabase-url:latest,SUPABASE_JWKS_URL=buyer-dash-supabase-jwks-url:latest,SUPABASE_SERVICE_ROLE_KEY=buyer-dash-supabase-service-role:latest,INTEGRATION_ENCRYPTION_KEY=buyer-dash-integration-encryption-key:latest" \
            --quiet

      - name: Verify Cloud Run selected the exact deployed revision
        id: service-url
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "${{ env.API_SERVICE }}" --region "${{ env.REGION }}" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "${{ env.API_SERVICE }}" --region "${{ env.REGION }}" --format='value(status.latestReadyRevisionName)')"
          DEPLOYED_IMAGE="$(gcloud run revisions describe "$REVISION" --region "${{ env.REGION }}" --format='value(spec.containers[0].image)')"
          echo "Cloud Run API service: $SERVICE_URL"
          echo "Latest ready revision: $REVISION"
          echo "Revision image: $DEPLOYED_IMAGE"
          echo "Expected revision suffix: $EXPECTED_REVISION_SUFFIX"
          if [[ "$REVISION" != *"$EXPECTED_REVISION_SUFFIX" ]]; then
            echo "Refusing cutover: Cloud Run latest ready revision is not the revision just deployed"
            exit 1
          fi
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Verify release SHA and schema head on production hostname
        run: |
          set -euo pipefail
          SERVICE_URL="${{ env.PRODUCTION_API_URL }}"
          EXPECTED_RELEASE="${{ github.event.pull_request.head.sha }}"
          for attempt in $(seq 1 30); do
            ready=$(curl -sS -o /tmp/ready.json -w '%{http_code}' "$SERVICE_URL/health/ready" || true)
            if [ "$ready" = "200" ]; then
              RELEASE="$(jq -r '.release_sha // ""' /tmp/ready.json)"
              DB_HEAD="$(jq -r '.schema_revision // ""' /tmp/ready.json)"
              RUNTIME_HEAD="$(jq -r '.expected_schema_revision // ""' /tmp/ready.json)"
              SCHEMA_MATCHES="$(jq -r '.schema_matches // false' /tmp/ready.json)"
              echo "release=$RELEASE db_head=$DB_HEAD runtime_head=$RUNTIME_HEAD schema_matches=$SCHEMA_MATCHES"
              if [ "$RELEASE" = "$EXPECTED_RELEASE" ] \
                && [ "$DB_HEAD" = "$IMAGE_SCHEMA_HEAD" ] \
                && [ "$RUNTIME_HEAD" = "$IMAGE_SCHEMA_HEAD" ] \
                && [ "$SCHEMA_MATCHES" = "true" ]; then
                cat /tmp/ready.json
                echo "Production identity verified: release SHA, image schema head, and DB schema head all match"
                exit 0
              fi
              echo "Production hostname is healthy but is not yet serving the exact release/schema identity"
            else
              echo "Waiting for production API readiness (http=$ready)"
            fi
            sleep 6
          done
          echo "Production release/schema identity verification failed"
          cat /tmp/ready.json || true
          exit 1

      - name: Diagnose api.doobielogic.io mapping
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "Direct Cloud Run URL: ${{ steps.service-url.outputs.url }}"
          echo "Custom API hostname response:"
          curl -sS -i "${{ env.PRODUCTION_API_URL }}/health/ready" | head -60 || true
          echo "Cloud Run domain mappings:"
          gcloud run domain-mappings list --region "${{ env.REGION }}" --format='table(metadata.name,spec.routeName,status.conditions[0].status,status.resourceRecords)' || true

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push production web image
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/buyer-dash/${{ env.WEB_SERVICE }}:${{ github.event.pull_request.head.sha }}-a${{ github.run_attempt }}"
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_URL=${{ env.PRODUCTION_API_URL }} \
            --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }} \
            -t "$IMAGE" frontend
          docker push "$IMAGE"
          echo "WEB_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy production web service
        run: |
          set -euo pipefail
          gcloud run deploy "${{ env.WEB_SERVICE }}" \
            --image "$WEB_IMAGE" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --service-account "${{ secrets.GCP_SERVICE_ACCOUNT }}" \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 1 \
            --max-instances 10 \
            --quiet

      - name: Smoke test ops.doobielogic.io
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code=$(curl -sS -L -o /tmp/ops.html -w '%{http_code}' https://ops.doobielogic.io || true)
            if [ "$code" = "200" ]; then
              grep -qi 'DoobieLogic\|Buyer' /tmp/ops.html
              echo "ops.doobielogic.io is serving the production cutover"
              exit 0
            fi
            echo "Waiting for ops.doobielogic.io (http=$code)"
            sleep 6
          done
          head -100 /tmp/ops.html || true
          exit 1
