name: Production Cutover Diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose-migration:
    if: github.event.pull_request.number == 276 && github.event.pull_request.head.ref == 'fix/exact-streamlit-parity-v2'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Describe failed migration execution
        run: |
          set -x
          gcloud run jobs executions describe buyer-dash-migrate-pdxjw \
            --region us-east1 \
            --format=yaml || true
      - name: Read migration execution logs
        run: |
          set -x
          gcloud beta run jobs executions logs read buyer-dash-migrate-pdxjw \
            --region us-east1 \
            --limit 200 || true
      - name: Read Cloud Run job logs fallback
        run: |
          set -x
          gcloud logging read \
            'resource.type="cloud_run_job" AND resource.labels.job_name="buyer-dash-migrate"' \
            --limit 200 \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
