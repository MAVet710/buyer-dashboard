name: Cleanup Buyer Intelligence diff v2

on:
  push:
    branches:
      - agent/useful-buyer-intelligence
    paths:
      - .github/workflows/cleanup-buyer-intelligence-diff-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/useful-buyer-intelligence
          fetch-depth: 0

      - name: Restore main app and apply byte-preserving targeted edits
        run: |
          git fetch origin main
          git checkout origin/main -- app.py
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app.py")
          data = path.read_bytes()

          def replace_once(pattern: bytes, repl_fn, label: str):
              global data
              data2, count = re.subn(pattern, repl_fn, data, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected one replacement, got {count}")
              data = data2

          replace_once(
              rb"from modules\.doobie_response import format_doobie_response(?P<nl>\r?\n)",
              lambda m: (
                  b"from modules.doobie_response import format_doobie_response" + m.group("nl")
                  + b"from services.buyer_intelligence_brief import (" + m.group("nl")
                  + b"    buyer_intelligence_ai_enabled," + m.group("nl")
                  + b"    generate_buyer_intelligence_brief," + m.group("nl")
                  + b")" + m.group("nl")
              ),
              "buyer brief import",
          )

          replace_once(
              rb"def _generate_buyer_brief_ai\(summary, by_category, by_product, lookback_days\):(?P<nl>\r?\n).*?(?=\r?\ndef _run_main_ai_copilot)",
              lambda m: (
                  b"def _generate_buyer_brief_ai(summary, by_category, by_product, lookback_days):" + m.group("nl")
                  + b"    \"\"\"Build a store-specific brief from deterministic evidence plus Gemini.\"\"\"" + m.group("nl")
                  + b"    return generate_buyer_intelligence_brief(" + m.group("nl")
                  + b"        summary=summary," + m.group("nl")
                  + b"        by_category=by_category," + m.group("nl")
                  + b"        by_product=by_product," + m.group("nl")
                  + b"        lookback_days=lookback_days," + m.group("nl")
                  + b"    )" + m.group("nl")
              ),
              "buyer brief function",
          )

          replace_once(
              rb'    st\.caption\("Demand, risk, and AI buyer brief generated from your uploaded sales/inventory data\."\)',
              lambda m: b'    st.caption("Demand, coverage, and ranked buyer actions grounded in the sales and inventory data loaded for this store.")',
              "buyer intelligence caption",
          )

          replace_once(
              rb'        st\.markdown\("### 🤖 AI Buyer Brief"\)(?P<nl>\r?\n)'
              rb'        if not _doobie_ai_access_enabled\(\):\r?\n'
              rb'            st\.info\("Connect Doobie AI to enable this feature\."\)\r?\n'
              rb'        elif st\.button\("Generate AI Buyer Brief", key="buyer_intel_ai_brief"\):\r?\n'
              rb'            with st\.spinner\("Generating buyer brief\.\.\."\):\r?\n'
              rb'                brief = _generate_buyer_brief_ai\(summary, by_category, by_product, lookback_days\)\r?\n'
              rb'            st\.markdown\(brief\)\r?\n',
              lambda m: (
                  b'        st.markdown("### 🤖 Data-Backed Buyer Brief")' + m.group("nl")
                  + b'        st.caption("Starts with exact store evidence, then uses Gemini only for a data-specific interpretation. Generic AI filler is discarded.")' + m.group("nl")
                  + b'        if not buyer_intelligence_ai_enabled():' + m.group("nl")
                  + b'            st.info("Gemini is not configured. The deterministic Buyer Intelligence tables above remain available.")' + m.group("nl")
                  + b'        elif st.button("Generate Buyer Brief", key="buyer_intel_ai_brief"):' + m.group("nl")
                  + b'            with st.spinner("Analyzing the exact SKUs, coverage, and assortment gaps in this store..."):' + m.group("nl")
                  + b'                brief = _generate_buyer_brief_ai(summary, by_category, by_product, lookback_days)' + m.group("nl")
                  + b'            st.markdown(brief)' + m.group("nl")
              ),
              "buyer intelligence UI",
          )

          path.write_bytes(data)
          PY

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/normalize-buyer-intelligence-diff.yml
          rm -f .github/workflows/cleanup-buyer-intelligence-diff-v2.yml

      - name: Verify app diff is surgical
        run: |
          changed=$(git diff --numstat origin/main -- app.py | awk '{print $1+$2}')
          echo "app.py changed lines: ${changed:-0}"
          test "${changed:-0}" -lt 150

      - name: Commit cleaned diff
        run: |
          git config user.name "MAVet710"
          git config user.email "149276571+MAVet710@users.noreply.github.com"
          git add app.py .github/workflows/normalize-buyer-intelligence-diff.yml .github/workflows/cleanup-buyer-intelligence-diff-v2.yml
          git commit -m "Clean Buyer Intelligence app diff"
          git push origin agent/useful-buyer-intelligence
