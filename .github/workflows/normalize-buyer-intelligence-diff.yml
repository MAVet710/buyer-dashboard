name: Normalize Buyer Intelligence diff

on:
  push:
    branches:
      - agent/useful-buyer-intelligence
    paths:
      - .github/workflows/normalize-buyer-intelligence-diff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/useful-buyer-intelligence
          fetch-depth: 0

      - name: Restore app.py bytes from main and apply surgical replacements
        run: |
          git fetch origin main
          git show origin/main:app.py > /tmp/app-main.py
          cp /tmp/app-main.py app.py
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          data = path.read_bytes()
          newline = b"\r\n" if data.count(b"\r\n") > data.count(b"\n") // 2 else b"\n"

          def block(text: str) -> bytes:
              return text.replace("\n", newline.decode()).encode()

          import_anchor = block("from modules.doobie_response import format_doobie_response\n")
          import_replacement = block(
              "from modules.doobie_response import format_doobie_response\n"
              "from services.buyer_intelligence_brief import (\n"
              "    buyer_intelligence_ai_enabled,\n"
              "    generate_buyer_intelligence_brief,\n"
              ")\n"
          )
          if import_anchor not in data:
              raise SystemExit("import anchor missing")
          data = data.replace(import_anchor, import_replacement, 1)

          start = data.find(block("def _generate_buyer_brief_ai(summary, by_category, by_product, lookback_days):\n"))
          end_marker = block("\ndef _run_main_ai_copilot")
          end = data.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("buyer brief function boundaries missing")
          replacement = block(
              "def _generate_buyer_brief_ai(summary, by_category, by_product, lookback_days):\n"
              "    \"\"\"Build a store-specific brief from deterministic evidence plus Gemini.\"\"\"\n"
              "    return generate_buyer_intelligence_brief(\n"
              "        summary=summary,\n"
              "        by_category=by_category,\n"
              "        by_product=by_product,\n"
              "        lookback_days=lookback_days,\n"
              "    )\n\n"
          )
          data = data[:start] + replacement + data[end + len(newline):]

          old_caption = block('    st.caption("Demand, risk, and AI buyer brief generated from your uploaded sales/inventory data.")')
          new_caption = block('    st.caption("Demand, coverage, and ranked buyer actions grounded in the sales and inventory data loaded for this store.")')
          if old_caption in data:
              data = data.replace(old_caption, new_caption, 1)

          old_gate = block(
              '        st.markdown("### 🤖 AI Buyer Brief")\n'
              '        if not _doobie_ai_access_enabled():\n'
              '            st.info("Connect Doobie AI to enable this feature.")\n'
              '        elif st.button("Generate AI Buyer Brief", key="buyer_intel_ai_brief"):\n'
              '            with st.spinner("Generating buyer brief..."):\n'
              '                brief = _generate_buyer_brief_ai(summary, by_category, by_product, lookback_days)\n'
              '            st.markdown(brief)\n'
          )
          new_gate = block(
              '        st.markdown("### 🤖 Data-Backed Buyer Brief")\n'
              '        st.caption("Starts with exact store evidence, then uses Gemini only for a data-specific interpretation. Generic AI filler is discarded.")\n'
              '        if not buyer_intelligence_ai_enabled():\n'
              '            st.info("Gemini is not configured. The deterministic Buyer Intelligence tables above remain available.")\n'
              '        elif st.button("Generate Buyer Brief", key="buyer_intel_ai_brief"):\n'
              '            with st.spinner("Analyzing the exact SKUs, coverage, and assortment gaps in this store..."):\n'
              '                brief = _generate_buyer_brief_ai(summary, by_category, by_product, lookback_days)\n'
              '            st.markdown(brief)\n'
          )
          if old_gate not in data:
              raise SystemExit("Buyer Intelligence UI gate missing")
          data = data.replace(old_gate, new_gate, 1)
          path.write_bytes(data)
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/normalize-buyer-intelligence-diff.yml

      - name: Commit cleaned diff
        run: |
          git config user.name "MAVet710"
          git config user.email "149276571+MAVet710@users.noreply.github.com"
          git add app.py .github/workflows/normalize-buyer-intelligence-diff.yml
          git commit -m "Keep Buyer Intelligence app diff surgical"
          git push origin agent/useful-buyer-intelligence
