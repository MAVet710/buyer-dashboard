name: Performance Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: performance-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  realistic-volume-performance:
    name: Realistic-volume performance contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install performance-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r backend/requirements.txt pytest httpx

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run bounded realistic-volume contract
        env:
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_realistic_volume_performance.py --durations=25 | tee /tmp/performance-contract.txt
          {
            echo "## Realistic-volume performance contract"
            echo
            echo '```text'
            cat /tmp/performance-contract.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
