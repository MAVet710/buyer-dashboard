name: Seed Cowboy Kush Demo Data

on:
  push:
    branches: [main]
    paths:
      - scripts/seed_cowboy_kush_ma_coa_demo.py
      - .github/workflows/seed-cowboy-kush-demo.yml
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type I_APPROVE_COWBOY_KUSH_DEMO_SEED to write demo data"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cowboy-kush-demo-seed
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install seed dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate Cowboy Kush seed definition without database access
        run: |
          python - <<'PY'
          from scripts.seed_cowboy_kush_ma_coa_demo import BATCHES

          assert len(BATCHES) >= 10
          assert any(batch.bulk for batch in BATCHES)
          assert all(batch.coa_url.startswith("https://opencoa.org/") for batch in BATCHES)
          print(f"Validated {len(BATCHES)} Cowboy Kush demo batches without contacting production.")
          PY

  apply:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'I_APPROVE_COWBOY_KUSH_DEMO_SEED' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-demo-data
    env:
      DL_PROD_DB_URL: ${{ secrets.DL_PROD_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Require explicit write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DL_PROD_DB_URL" || {
            echo "DL_PROD_DB_URL must be configured as a GitHub Actions secret before manual demo seeding."
            exit 1
          }
          echo "Manual Cowboy Kush demo seed is explicitly approved; credential value was not printed."

      - name: Install application dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Dry-run Cowboy Kush demo seed first
        run: python -m scripts.seed_cowboy_kush_ma_coa_demo

      - name: Apply Cowboy Kush demo seed
        run: python -m scripts.seed_cowboy_kush_ma_coa_demo --apply

      - name: Record mutation boundary
        run: |
          {
            echo '## Cowboy Kush demo seed'
            echo
            echo '- Trigger: manual workflow dispatch only'
            echo '- Confirmation: exact approval phrase required'
            echo '- Automatic main-push behavior: validation only; no database write'
            echo '- Google Cloud resources: none'
          } >> "$GITHUB_STEP_SUMMARY"
