name: MA Metrc Public Contract Review
on:
  pull_request:
    paths:
      - '.github/workflows/metrc-public-contract-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read official public sandbox collection (no credentials, no provider mutations)
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone

          url = 'https://sandbox-api-ma.metrc.com/Documentation/postman-json'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('Documentation redirect requires separate review')
          opener = urllib.request.build_opener(NoRedirect)
          request = urllib.request.Request(url, headers={'Accept': 'application/json'})
          with opener.open(request, timeout=30) as response:
              raw = response.read(12000001)
          if len(raw) > 12000000:
              raise RuntimeError('Public collection exceeded size limit')
          collection = json.loads(raw)
          print('PUBLIC_DOCUMENTATION_ONLY', url, datetime.now(timezone.utc).isoformat())
          print('SHA256', hashlib.sha256(raw).hexdigest())
          print('COLLECTION_AUTH_TYPE', (collection.get('auth') or {}).get('type'))
          selected = {
              ('POST','/sandbox/v2/integrator/setup'),
              ('POST','/sandbox/v2/packages/create'),
              ('POST','/sandbox/v2/facility/tags'),
              ('GET','/sandbox/v2/tagtypes'),
              ('GET','/sales/v2/customertypes'),
              ('GET','/packages/v2/active'),
              ('POST','/packages/v2'),
              ('PUT','/packages/v2/item'),
              ('POST','/plants/v2/plantbatch/packages'),
          }
          found = set()
          inspected = 0
          def walk(items, inherited_auth):
              global inspected
              for item in items:
                  request = item.get('request') or {}
                  auth = request.get('auth') or inherited_auth or {}
                  address = request.get('url') or {}
                  path_parts = address.get('path') if isinstance(address, dict) else None
                  if isinstance(path_parts, list) and path_parts:
                      path = '/' + '/'.join(path_parts)
                  elif path_parts:
                      path = str(path_parts)
                  else:
                      raw_url = address.get('raw', '') if isinstance(address, dict) else str(address)
                      match = re.search(r'/(?:sandbox|packages|plants|sales)/v2(?:/[^?\s#]*)?', raw_url)
                      path = match.group(0) if match else ''
                  identity = (request.get('method'), path.rstrip('/'))
                  if request and inspected < 2:
                      print('PUBLIC_REQUEST_SHAPE', json.dumps({'name': item.get('name'), 'url': address, 'method': request.get('method')}))
                      inspected += 1
                  if identity in selected:
                      found.add(identity)
                      print(json.dumps({
                          'method': identity[0], 'path': identity[1],
                          'auth_type': auth.get('type'),
                          'query': address.get('query', []) if isinstance(address, dict) else [],
                          'body': request.get('body'),
                          'description': request.get('description'),
                          'examples': [{'code': r.get('code'), 'body': r.get('body')} for r in item.get('response', [])[:1]],
                      }, ensure_ascii=True))
                  walk(item.get('item') or [], item.get('auth') or auth)
          walk(collection.get('item') or [], collection.get('auth'))
          missing = selected - found
          print('MISSING_CONTRACTS', sorted(missing))
          if missing:
              raise SystemExit(1)
          PY
