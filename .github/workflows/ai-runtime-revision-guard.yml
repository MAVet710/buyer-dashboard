name: Audit Local AI Runtime

on:
  workflow_run:
    workflows: ["Deploy to DoobieLogic"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doobielogic-ai-runtime-audit
  cancel-in-progress: true

jobs:
  audit-local-ai:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce PC-hosted zero-cost contract
        run: python scripts/verify_zero_cost_deployment.py

      - name: Verify API defaults cannot use paid cloud AI fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("backend/app/config.py").read_text(encoding="utf-8")
          required = (
              'ai_provider_mode: str = "local_only"',
              'ai_provider_order: str = "local"',
              'ai_allow_cloud_fallback: bool = False',
          )
          missing = [value for value in required if value not in source]
          if missing:
              raise SystemExit("PC-hosted API AI defaults are incomplete or no longer fail-closed: " + ", ".join(missing))
          print("PC-hosted API AI policy verified: local-only by default with no cloud fallback.")
          PY

      - name: Report optional workstation Local AI declaration
        shell: bash
        env:
          LOCAL_AI_RUNTIME_STATE: ${{ vars.LOCAL_AI_RUNTIME_STATE }}
          LOCAL_LLM_BASE_URL: ${{ vars.LOCAL_LLM_BASE_URL }}
          LOCAL_LLM_MODEL: ${{ vars.LOCAL_LLM_MODEL }}
        run: |
          set -euo pipefail
          state="${LOCAL_AI_RUNTIME_STATE:-disabled}"
          case "$state" in
            disabled|"")
              echo "No optional workstation model is declared. The API remains local-only and cannot fall back to paid cloud AI."
              ;;
            enabled)
              test -n "${LOCAL_LLM_BASE_URL:-}" || { echo "LOCAL_AI_RUNTIME_STATE=enabled but LOCAL_LLM_BASE_URL is empty."; exit 1; }
              test -n "${LOCAL_LLM_MODEL:-}" || { echo "LOCAL_AI_RUNTIME_STATE=enabled but LOCAL_LLM_MODEL is empty."; exit 1; }
              case "$LOCAL_LLM_BASE_URL" in http://127.0.0.1:*|http://localhost:*|https://*) ;; *) echo "LOCAL_LLM_BASE_URL must be local loopback or HTTPS."; exit 1 ;; esac
              echo "Workstation Local AI declaration is structurally valid and remains decoupled from paid cloud AI fallback."
              ;;
            *)
              echo "LOCAL_AI_RUNTIME_STATE must be enabled or disabled; got '$state'."
              exit 1
              ;;
          esac
