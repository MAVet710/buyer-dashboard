name: Audit Local AI Runtime

on:
  workflow_run:
    workflows: ["Deploy to DoobieLogic"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doobielogic-ai-runtime-audit
  cancel-in-progress: true

jobs:
  audit-local-ai:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce zero-cost hosting contract
        run: python scripts/verify_zero_cost_deployment.py

      - name: Verify hosted API cannot use paid cloud AI fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("render.yaml").read_text(encoding="utf-8")
          required = (
              "- key: AI_PROVIDER_MODE\n        value: disabled",
              "- key: AI_PROVIDER_ORDER\n        value: none",
              "- key: AI_ALLOW_CLOUD_FALLBACK\n        value: \"false\"",
          )
          missing = [value for value in required if value not in source]
          if missing:
              raise SystemExit("Hosted Render API AI policy is incomplete or no longer fail-closed.")
          forbidden = ("GEMINI_API_KEY", "OPENAI_API_KEY")
          leaked = [name for name in forbidden if name in source]
          if leaked:
              raise SystemExit("Hosted free configuration unexpectedly declares cloud AI credentials: " + ", ".join(leaked))
          print("Hosted API AI policy verified: disabled by default, no paid cloud fallback or cloud API credential wiring.")
          PY

      - name: Report optional workstation Local AI declaration
        shell: bash
        env:
          LOCAL_AI_RUNTIME_STATE: ${{ vars.LOCAL_AI_RUNTIME_STATE }}
          LOCAL_LLM_BASE_URL: ${{ vars.LOCAL_LLM_BASE_URL }}
          LOCAL_LLM_MODEL: ${{ vars.LOCAL_LLM_MODEL }}
        run: |
          set -euo pipefail
          state="${LOCAL_AI_RUNTIME_STATE:-disabled}"
          case "$state" in
            disabled|"")
              echo "Workstation Local AI is not declared active. Hosted API remains AI-disabled."
              ;;
            enabled)
              test -n "${LOCAL_LLM_BASE_URL:-}" || { echo "LOCAL_AI_RUNTIME_STATE=enabled but LOCAL_LLM_BASE_URL is empty."; exit 1; }
              test -n "${LOCAL_LLM_MODEL:-}" || { echo "LOCAL_AI_RUNTIME_STATE=enabled but LOCAL_LLM_MODEL is empty."; exit 1; }
              case "$LOCAL_LLM_BASE_URL" in https://*) ;; *) echo "LOCAL_LLM_BASE_URL must use HTTPS."; exit 1 ;; esac
              echo "Workstation Local AI declaration is structurally valid; hosted Render API remains decoupled and cannot fall back to paid cloud AI."
              ;;
            *)
              echo "LOCAL_AI_RUNTIME_STATE must be enabled or disabled; got '$state'."
              exit 1
              ;;
          esac
