name: Audit Local AI Runtime

on:
  workflow_run:
    workflows: ["Deploy to DoobieLogic"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: doobielogic-production
  cancel-in-progress: false

env:
  API_SERVICE: buyer-dash-api
  REGION: us-east1

jobs:
  audit-local-ai:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify active revision matches declared Local AI state
        run: |
          set -euo pipefail
          state="${{ vars.LOCAL_AI_RUNTIME_STATE }}"
          case "$state" in enabled|disabled) ;; *) echo "Local AI state is missing or invalid: $state"; exit 1 ;; esac

          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          SERVICE_JSON="$(gcloud run services describe "$API_SERVICE" --project "$PROJECT" --region "$REGION" --format=json)"
          ACTIVE_REVISION="$(printf '%s' "$SERVICE_JSON" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName][0] // ""')"
          test -n "$ACTIVE_REVISION"
          gcloud run revisions describe "$ACTIVE_REVISION" --project "$PROJECT" --region "$REGION" --format=json > /tmp/active-ai-revision.json

          actual_mode="$(jq -r '[.spec.containers[0].env[]? | select(.name == "AI_PROVIDER_MODE") | .value][0] // ""' /tmp/active-ai-revision.json)"
          if [ "$state" = "disabled" ]; then
            [ "$actual_mode" = "disabled" ] || { echo "Local AI is intentionally disabled, but the active revision is not declared disabled."; exit 1; }
            echo "Local AI is intentionally disabled and production matches that state."
            exit 0
          fi

          expected_base="${{ vars.LOCAL_LLM_BASE_URL }}"
          expected_model="${{ vars.LOCAL_LLM_MODEL }}"
          [ -n "$expected_base" ] && [ -n "$expected_model" ] || { echo "Enabled Local AI declaration is incomplete."; exit 1; }
          actual_base="$(jq -r '[.spec.containers[0].env[]? | select(.name == "LOCAL_LLM_BASE_URL") | .value][0] // ""' /tmp/active-ai-revision.json)"
          actual_model="$(jq -r '[.spec.containers[0].env[]? | select(.name == "LOCAL_LLM_MODEL") | .value][0] // ""' /tmp/active-ai-revision.json)"
          auth_refs="$(jq -r '[.spec.containers[0].env[]? | select(.name == "LOCAL_LLM_ACCESS_CLIENT_ID" or .name == "LOCAL_LLM_ACCESS_CLIENT_SECRET") | select(.valueFrom.secretKeyRef.name != null)] | length' /tmp/active-ai-revision.json)"

          [ "$actual_mode" = "local_only" ] || { echo "Local AI is enabled but active mode is invalid or missing."; exit 1; }
          [ "$actual_base" = "$expected_base" ] || { echo "Active Local AI URL differs from the durable declaration."; exit 1; }
          [ "$actual_model" = "$expected_model" ] || { echo "Active Local AI model differs from the durable declaration."; exit 1; }
          [ "$auth_refs" = "2" ] || { echo "Active Local AI Access credentials are not backed by the expected Secret Manager refs."; exit 1; }
          echo "Active production revision $ACTIVE_REVISION matches the durable Local AI declaration."
