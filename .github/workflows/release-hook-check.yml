name: Verify provider release hooks

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/release-hook-check.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check frontend release marker
        shell: bash
        run: |
          status=$(curl --silent --show-error --location --output /tmp/release.json --write-out '%{http_code}' --connect-timeout 10 --max-time 30 https://ops.doobielogic.io/release.json || true)
          echo "release_marker_status=$status"
          cat /tmp/release.json 2>/dev/null || true
          echo
      - name: Check API readiness
        shell: bash
        run: |
          status=$(curl --silent --show-error --location --output /tmp/ready.json --write-out '%{http_code}' --connect-timeout 10 --max-time 30 https://api.doobielogic.io/health/ready || true)
          echo "api_ready_status=$status"
          cat /tmp/ready.json 2>/dev/null || true
          echo
