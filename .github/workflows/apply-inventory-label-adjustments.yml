name: Apply Inventory Label Adjustments

on:
  push:
    branches:
      - agent/inventory-label-adjustments-3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/inventory-label-adjustments-3
          fetch-depth: 0
      - name: Apply Inventory v2 action patch
        run: python scripts/apply_inventory_label_adjustments.py
      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- modules/inventory_command_center.py
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "Wire labels and adjustments into Inventory v2"
          git push origin HEAD:agent/inventory-label-adjustments-3
