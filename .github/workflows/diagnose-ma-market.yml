name: Diagnose MA market schema

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-ma-market.yml"
      - "services/market_data/**"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install market parser dependency
        run: python -m pip install pandas
      - name: Verify live CCC trend calculation
        run: |
          python - <<'PY'
          from services.market_data.ma_ccc import MassachusettsCCCProvider
          from services.market_data.market_intelligence import _sales_summary

          dataset = MassachusettsCCCProvider(timeout_seconds=30).fetch_sales()
          for days in (30, 60):
              statewide, categories = _sales_summary(dataset, days)
              print("WINDOW", days, "AS_OF", statewide["as_of"], "STATEWIDE", statewide["market_growth"])
              for category in ["Flower", "Vapes", "Pre-Rolls", "Infused Pre-Rolls", "Edibles", "Beverages", "Concentrates"]:
                  row = categories.get(category)
                  print("CATEGORY", category, None if row is None else row["market_growth"])
              required = ["Flower", "Vapes", "Pre-Rolls", "Edibles", "Concentrates"]
              missing = [category for category in required if categories.get(category, {}).get("market_growth") is None]
              if missing:
                  raise SystemExit(f"Required MA trend categories did not populate for {days} days: {missing}")
          PY
