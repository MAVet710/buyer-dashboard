name: Diagnose MA market schema

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-ma-market.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect CCC market sources
        run: |
          python - <<'PY'
          import collections, json, subprocess
          from datetime import date

          def read(url):
              return subprocess.check_output([
                  "curl", "-LfsS", "--max-time", "30",
                  "-A", "DoobieLogic-Market-Diagnostic/1.0", url,
              ])

          url = "https://masscannabiscontrol.com/resource/a_sales_au_gross.json"
          rows = json.loads(read(url).decode("utf-8-sig"))
          print("ROWS", len(rows))
          print("KEYS", sorted(rows[0].keys()))
          for field in ["Industry", "DataType", "SalesPeriodType", "UnitOfMeasureName"]:
              print(field, collections.Counter(str(row.get(field)) for row in rows).most_common())
          dates = sorted(str(row.get("SaleDate")) for row in rows if row.get("SaleDate"))
          print("DATE_RANGE", dates[0], dates[-1])
          print("LATEST_DATES", sorted(set(dates))[-10:])
          print("CATEGORIES", sorted(set(str(row.get("ProductCategoryName")) for row in rows)))

          key_counts = collections.Counter(
              (row.get("SaleDate"), row.get("ProductCategoryName"), row.get("DataType"), row.get("UnitOfMeasureName"), row.get("SalesPeriodType"))
              for row in rows
          )
          print("EXACT_DUPLICATE_DIMENSION_KEYS", sum(1 for count in key_counts.values() if count > 1), "MAX", max(key_counts.values()))

          latest = max(row.get("SaleDate") for row in rows if row.get("SaleDate"))
          print("LATEST_ROWS_SAMPLE")
          for row in [row for row in rows if row.get("SaleDate") == latest][:30]:
              print(json.dumps(row, sort_keys=True))
          PY
