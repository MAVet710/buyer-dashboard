name: React and FastAPI gates
on:
  pull_request:
  push:
    branches: [main, feat/react-fastapi-migration]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Verify strict Streamlit product parity contract
        run: python scripts/verify_streamlit_parity.py --mode contract
      - run: pip install -r requirements.txt -r backend/requirements.txt pytest httpx
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Install browser parity runner
        run: pnpm add --save-dev @playwright/test@1.55.0 --lockfile=false
      - name: Install Chromium for browser parity
        run: pnpm exec playwright install --with-deps chromium
      - name: Run real-browser responsive parity matrix
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4173 > /tmp/doobielogic-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID' EXIT
          READY=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/doobielogic-vite.log
            exit 1
          fi
          pnpm exec playwright test --config=playwright.config.ts e2e/parity-browser.spec.ts e2e/inventory-product-actions-mobile.spec.ts e2e/label-studio-inventory-autofill.spec.ts
      - name: Upload browser parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-parity-evidence
          path: frontend/test-results/browser-parity
          if-no-files-found: warn
          retention-days: 14
  operator-alpha-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install backend alpha dependencies
        run: pip install -r requirements.txt -r backend/requirements.txt pytest httpx
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Install frontend alpha dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install operator browser runner
        working-directory: frontend
        run: pnpm add --save-dev @playwright/test@1.55.0 --lockfile=false
      - name: Install Chromium for operator alpha
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Migrate and seed integrated operator alpha facility
        run: |
          set -euo pipefail
          export DATABASE_URL=sqlite+pysqlite:///./operator-alpha.db
          rm -f operator-alpha.db
          alembic upgrade head
          alembic current | tee /tmp/operator-alpha-alembic.txt
          test -s /tmp/operator-alpha-alembic.txt
          python scripts/seed_operator_alpha.py | tee /tmp/operator-alpha.env
          test -s /tmp/operator-alpha.env
          grep -q '^ALPHA_ORGANIZATION_ID=' /tmp/operator-alpha.env
          grep -q '^ALPHA_FACILITY_ID=' /tmp/operator-alpha.env
          cat /tmp/operator-alpha.env >> "$GITHUB_ENV"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
      - name: Run every operator workspace against real FastAPI
        env:
          APP_ENV: development
          CORS_ORIGINS: http://127.0.0.1:4173
          ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
          VITE_API_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/operator-alpha-api.log 2>&1 &
          API_PID=$!
          (
            cd frontend
            pnpm exec vite --host 127.0.0.1 --port 4173 > /tmp/operator-alpha-web.log 2>&1
          ) &
          WEB_PID=$!
          trap 'kill $API_PID $WEB_PID 2>/dev/null || true' EXIT

          API_READY=0
          WEB_READY=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then API_READY=1; fi
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then WEB_READY=1; fi
            if [ "$API_READY" -eq 1 ] && [ "$WEB_READY" -eq 1 ]; then break; fi
            sleep 1
          done
          if [ "$API_READY" -ne 1 ]; then
            echo "FastAPI did not become ready"
            cat /tmp/operator-alpha-api.log
            exit 1
          fi
          if [ "$WEB_READY" -ne 1 ]; then
            echo "React did not become ready"
            cat /tmp/operator-alpha-web.log
            exit 1
          fi

          set +e
          cd frontend
          ALPHA_ORGANIZATION_ID="$ALPHA_ORGANIZATION_ID" \
          ALPHA_FACILITY_ID="$ALPHA_FACILITY_ID" \
          pnpm exec playwright test --config=playwright.config.ts e2e/operator-alpha-real.spec.ts
          ALPHA_STATUS=$?
          cd ..
          set -e
          if [ "$ALPHA_STATUS" -ne 0 ]; then
            echo "=== FastAPI operator-alpha log (last 300 lines) ==="
            tail -n 300 /tmp/operator-alpha-api.log || true
            echo "=== React operator-alpha log (last 150 lines) ==="
            tail -n 150 /tmp/operator-alpha-web.log || true
            exit "$ALPHA_STATUS"
          fi
      - name: Upload strict operator alpha evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-operator-alpha-evidence
          path: |
            frontend/test-results
            /tmp/operator-alpha-api.log
            /tmp/operator-alpha-web.log
            /tmp/operator-alpha-alembic.txt
          if-no-files-found: warn
          retention-days: 14
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t buyer-dash-api:ci .
      - name: Verify the API image can run production migrations
        run: docker run --rm buyer-dash-api:ci alembic --version
      - name: Verify the API image starts without Streamlit
        run: >-
          docker run --rm
          -e APP_ENV=production
          -e DATABASE_URL=sqlite+pysqlite:///:memory:
          -e SUPABASE_URL=https://example.supabase.co
          -e SUPABASE_JWKS_URL=https://example.supabase.co/auth/v1/.well-known/jwks.json
          -e SUPABASE_SERVICE_ROLE_KEY=test
          -e INTEGRATION_ENCRYPTION_KEY=test
          -e CORS_ORIGINS=https://ops.doobielogic.io
          -e ALLOWED_HOSTS=api.doobielogic.io
          buyer-dash-api:ci python -c "import backend.app.main"
      - run: docker build -f frontend/Dockerfile -t buyer-dash-web:ci --build-arg VITE_API_URL=https://api.doobielogic.io --build-arg VITE_SUPABASE_URL=https://example.supabase.co --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=test frontend
      - name: Scan API image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: buyer-dash-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
      - name: Scan frontend image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: buyer-dash-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml