name: React and FastAPI gates
on:
  pull_request:
  push:
    branches: [main, feat/react-fastapi-migration]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Verify strict Streamlit product parity contract
        run: python scripts/verify_streamlit_parity.py --mode contract
      - run: pip install -r requirements.txt -r backend/requirements.txt pytest httpx
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Install browser parity runner
        run: pnpm add --save-dev @playwright/test@1.55.0 --lockfile=false
      - name: Install Chromium for browser parity
        run: pnpm exec playwright install --with-deps chromium
      - name: Run real-browser responsive parity matrix
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4173 > /tmp/doobielogic-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID' EXIT
          READY=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/doobielogic-vite.log
            exit 1
          fi
          pnpm exec playwright test --config=playwright.config.ts e2e/parity-browser.spec.ts
      - name: Upload browser parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-parity-evidence
          path: frontend/test-results/browser-parity
          if-no-files-found: warn
          retention-days: 14
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t buyer-dash-api:ci .
      - name: Verify the API image can run production migrations
        run: docker run --rm buyer-dash-api:ci alembic --version
      - name: Verify the API image starts without Streamlit
        run: >-
          docker run --rm
          -e APP_ENV=production
          -e DATABASE_URL=sqlite+pysqlite:///:memory:
          -e SUPABASE_URL=https://example.supabase.co
          -e SUPABASE_JWKS_URL=https://example.supabase.co/auth/v1/.well-known/jwks.json
          -e SUPABASE_SERVICE_ROLE_KEY=test
          -e INTEGRATION_ENCRYPTION_KEY=test
          -e CORS_ORIGINS=https://ops.doobielogic.io
          -e ALLOWED_HOSTS=api.doobielogic.io
          buyer-dash-api:ci python -c "import backend.app.main"
      - run: docker build -f frontend/Dockerfile -t buyer-dash-web:ci --build-arg VITE_API_URL=https://api.doobielogic.io --build-arg VITE_SUPABASE_URL=https://example.supabase.co --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=test frontend
      - name: Scan API image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: buyer-dash-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
      - name: Scan frontend image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: buyer-dash-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
