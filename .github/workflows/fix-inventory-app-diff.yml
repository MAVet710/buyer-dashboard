name: Fix Inventory App Diff

on:
  push:
    branches:
      - agent/inventory-gemini-check

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/inventory-gemini-check
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Restore main line endings and reapply surgical patch
        run: python scripts/fix_inventory_app_diff.py

      - name: Validate targeted changes
        run: |
          python -m compileall -q app.py services/inventory_check.py tests/test_inventory_check.py
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests/test_inventory_check.py tests/test_gemini_agent.py tests/test_buyer_intelligence_brief.py

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/fix-inventory-app-diff.yml scripts/fix_inventory_app_diff.py
          git commit -m "Keep inventory Gemini patch surgical"
          git push origin HEAD:agent/inventory-gemini-check
