name: Apply MA package nullable field fix
on:
  pull_request:
    paths:
      - '.github/workflows/metrc-nullable-contract-fix.yml'
permissions:
  contents: write
jobs:
  patch-reviewed-field:
    if: github.event.pull_request.number == 548 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/metrc-eval-package-25-26'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/metrc-eval-package-25-26
      - name: Preserve explicit null from reviewed MA package request example
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('services/metrc_evaluation_lifecycle.py')
          source = path.read_text()
          before = '"RequiredLabTestBatches": _boolean(p, "required_lab_test_batches"),'
          after = '"RequiredLabTestBatches": None if p.get("required_lab_test_batches") is None else _boolean(p, "required_lab_test_batches"),'
          if after not in source:
              if source.count(before) != 1:
                  raise SystemExit('Exact reviewed source anchor changed; refusing to modify')
              path.write_text(source.replace(before, after))
          compile(path.read_text(), str(path), 'exec')
          PY
          git diff --check
          git diff -- services/metrc_evaluation_lifecycle.py
      - name: Commit only the reviewed field to the existing evaluation branch
        run: |
          if git diff --quiet -- services/metrc_evaluation_lifecycle.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/metrc_evaluation_lifecycle.py
          git commit -m 'Preserve explicit null for optional Metrc package lab batches'
          git push origin HEAD:codex/metrc-eval-package-25-26
