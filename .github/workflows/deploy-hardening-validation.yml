name: Deployment Hardening Validation

on:
  push:
    branches: [harden/production-deploy-identity]
    paths-ignore:
      - validation/deploy-hardening-result.txt
      - validation/deploy-hardening-web-build.log

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate workflow YAML
        id: yaml
        run: |
          python -m pip install --quiet pyyaml pytest
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('.github/workflows/deploy.yml')
          data = yaml.safe_load(path.read_text(encoding='utf-8'))
          assert isinstance(data, dict)
          assert 'jobs' in data and {'parity-release-gate', 'deploy-api', 'deploy-web'} <= set(data['jobs'])
          assert data.get('concurrency', {}).get('group') == 'doobielogic-production'
          assert data.get('concurrency', {}).get('cancel-in-progress') is False
          print('deploy.yml YAML parsed successfully')
          PY

      - name: Run deployment safety regression tests
        id: safety
        run: python -m pytest -q tests/test_production_deploy_safety.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        id: install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        id: lint
        working-directory: frontend
        run: pnpm lint

      - name: Frontend tests
        id: frontend_tests
        working-directory: frontend
        run: pnpm test

      - name: Frontend production build
        id: frontend_build
        working-directory: frontend
        env:
          VITE_RELEASE_SHA: ${{ github.sha }}
        run: pnpm build

      - name: Build frontend container
        id: web_container_build
        run: |
          set +e
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_URL=https://api.doobielogic.io \
            --build-arg VITE_SUPABASE_URL=https://example.supabase.co \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=test \
            --build-arg VITE_RELEASE_SHA=${{ github.sha }} \
            -t doobielogic-web-deploy-validation \
            frontend 2>&1 | tee /tmp/deploy-hardening-web-build.log
          status=${PIPESTATUS[0]}
          echo "docker_build_status=$status"
          exit "$status"

      - name: Validate nginx configuration
        id: nginx
        run: docker run --rm doobielogic-web-deploy-validation nginx -t

      - name: Validate container release identity
        id: release_identity
        run: |
          set -euo pipefail
          cid="$(docker create doobielogic-web-deploy-validation)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/share/nginx/html/release.json" /tmp/release.json
          cat /tmp/release.json
          jq -e --arg sha "${{ github.sha }}" '.release_sha == $sha' /tmp/release.json

      - name: Validate API image and Alembic head
        id: api_container
        run: |
          set -euo pipefail
          docker build -f Dockerfile.api -t doobielogic-api-deploy-validation .
          HEADS="$(docker run --rm doobielogic-api-deploy-validation alembic heads)"
          echo "$HEADS"
          test "$(printf '%s\n' "$HEADS" | grep -c '(head)' || true)" -eq 1

      - name: Record validation outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          YAML_STATUS: ${{ steps.yaml.outcome }}
          SAFETY_STATUS: ${{ steps.safety.outcome }}
          INSTALL_STATUS: ${{ steps.install.outcome }}
          LINT_STATUS: ${{ steps.lint.outcome }}
          FRONTEND_TEST_STATUS: ${{ steps.frontend_tests.outcome }}
          FRONTEND_BUILD_STATUS: ${{ steps.frontend_build.outcome }}
          WEB_CONTAINER_BUILD_STATUS: ${{ steps.web_container_build.outcome }}
          NGINX_STATUS: ${{ steps.nginx.outcome }}
          RELEASE_IDENTITY_STATUS: ${{ steps.release_identity.outcome }}
          API_CONTAINER_STATUS: ${{ steps.api_container.outcome }}
        run: |
          mkdir -p validation
          cat > validation/deploy-hardening-result.txt <<EOF
          status=${JOB_STATUS}
          validated_sha=${GITHUB_SHA}
          yaml=${YAML_STATUS}
          deployment_safety_tests=${SAFETY_STATUS}
          frontend_install=${INSTALL_STATUS}
          frontend_lint=${LINT_STATUS}
          frontend_tests=${FRONTEND_TEST_STATUS}
          frontend_build=${FRONTEND_BUILD_STATUS}
          frontend_container_build=${WEB_CONTAINER_BUILD_STATUS}
          nginx_config=${NGINX_STATUS}
          release_json_identity=${RELEASE_IDENTITY_STATUS}
          api_container_alembic=${API_CONTAINER_STATUS}
          EOF
          if [ -f /tmp/deploy-hardening-web-build.log ]; then
            tail -n 120 /tmp/deploy-hardening-web-build.log > validation/deploy-hardening-web-build.log
          else
            : > validation/deploy-hardening-web-build.log
          fi
          cat validation/deploy-hardening-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/deploy-hardening-result.txt validation/deploy-hardening-web-build.log
          git commit -m "Record deploy hardening validation result [skip ci]"
          git push origin HEAD:harden/production-deploy-identity
