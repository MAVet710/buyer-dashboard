name: Cleanup Buyer Intelligence diff v3

on:
  push:
    branches:
      - agent/useful-buyer-intelligence
    paths:
      - .github/workflows/cleanup-buyer-intelligence-diff-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/useful-buyer-intelligence
          fetch-depth: 0

      - name: Restore main app and apply targeted UTF-8 edits
        run: |
          git fetch origin main
          git checkout origin/main -- app.py
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app.py")
          text = path.read_bytes().decode("utf-8")

          def replace_once(pattern: str, repl, label: str):
              global text
              text2, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected one replacement, got {count}")
              text = text2

          replace_once(
              r"from modules\.doobie_response import format_doobie_response(?P<nl>\r?\n)",
              lambda m: (
                  "from modules.doobie_response import format_doobie_response" + m.group("nl")
                  + "from services.buyer_intelligence_brief import (" + m.group("nl")
                  + "    buyer_intelligence_ai_enabled," + m.group("nl")
                  + "    generate_buyer_intelligence_brief," + m.group("nl")
                  + ")" + m.group("nl")
              ),
              "buyer brief import",
          )

          replace_once(
              r"def _generate_buyer_brief_ai\(summary, by_category, by_product, lookback_days\):(?P<nl>\r?\n).*?(?=\r?\ndef _run_main_ai_copilot)",
              lambda m: (
                  "def _generate_buyer_brief_ai(summary, by_category, by_product, lookback_days):" + m.group("nl")
                  + "    \"\"\"Build a store-specific brief from deterministic evidence plus Gemini.\"\"\"" + m.group("nl")
                  + "    return generate_buyer_intelligence_brief(" + m.group("nl")
                  + "        summary=summary," + m.group("nl")
                  + "        by_category=by_category," + m.group("nl")
                  + "        by_product=by_product," + m.group("nl")
                  + "        lookback_days=lookback_days," + m.group("nl")
                  + "    )" + m.group("nl")
              ),
              "buyer brief function",
          )

          replace_once(
              r'    st\.caption\("Demand, risk, and AI buyer brief generated from your uploaded sales/inventory data\."\)',
              '    st.caption("Demand, coverage, and ranked buyer actions grounded in the sales and inventory data loaded for this store.")',
              "buyer intelligence caption",
          )

          replace_once(
              r'        st\.markdown\("### 🤖 AI Buyer Brief"\)(?P<nl>\r?\n)'
              r'        if not _doobie_ai_access_enabled\(\):\r?\n'
              r'            st\.info\("Connect Doobie AI to enable this feature\."\)\r?\n'
              r'        elif st\.button\("Generate AI Buyer Brief", key="buyer_intel_ai_brief"\):\r?\n'
              r'            with st\.spinner\("Generating buyer brief\.\.\."\):\r?\n'
              r'                brief = _generate_buyer_brief_ai\(summary, by_category, by_product, lookback_days\)\r?\n'
              r'            st\.markdown\(brief\)\r?\n',
              lambda m: (
                  '        st.markdown("### 🤖 Data-Backed Buyer Brief")' + m.group("nl")
                  + '        st.caption("Starts with exact store evidence, then uses Gemini only for a data-specific interpretation. Generic AI filler is discarded.")' + m.group("nl")
                  + '        if not buyer_intelligence_ai_enabled():' + m.group("nl")
                  + '            st.info("Gemini is not configured. The deterministic Buyer Intelligence tables above remain available.")' + m.group("nl")
                  + '        elif st.button("Generate Buyer Brief", key="buyer_intel_ai_brief"):' + m.group("nl")
                  + '            with st.spinner("Analyzing the exact SKUs, coverage, and assortment gaps in this store..."):' + m.group("nl")
                  + '                brief = _generate_buyer_brief_ai(summary, by_category, by_product, lookback_days)' + m.group("nl")
                  + '            st.markdown(brief)' + m.group("nl")
              ),
              "buyer intelligence UI",
          )

          path.write_bytes(text.encode("utf-8"))
          PY

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/normalize-buyer-intelligence-diff.yml
          rm -f .github/workflows/cleanup-buyer-intelligence-diff-v2.yml
          rm -f .github/workflows/cleanup-buyer-intelligence-diff-v3.yml

      - name: Verify app diff is surgical
        run: |
          changed=$(git diff --numstat origin/main -- app.py | awk '{print $1+$2}')
          echo "app.py changed lines: ${changed:-0}"
          test "${changed:-0}" -lt 150

      - name: Commit cleaned diff
        run: |
          git config user.name "MAVet710"
          git config user.email "149276571+MAVet710@users.noreply.github.com"
          git add -A app.py .github/workflows
          git commit -m "Finalize Buyer Intelligence app wiring"
          git push origin agent/useful-buyer-intelligence
