name: PC release PostgreSQL acceptance
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'modules/**'
      - 'tests/test_extraction_overview_performance.py'
      - 'migrations/**'
      - 'scripts/acceptance/pc_release_postgres_acceptance.py'
      - '.github/workflows/pc-release-postgres.yml'
permissions:
  contents: read
concurrency:
  group: pc-release-postgres-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authenticated-postgres-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: doobielogic_release_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d doobielogic_release_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:disposable-ci-only@127.0.0.1:5432/doobielogic_release_test
      COMAN_DATABASE_URL: postgresql+psycopg://postgres:disposable-ci-only@127.0.0.1:5432/doobielogic_release_test
      DOOBIELOGIC_TEST_POSTGRES_URL: postgresql+psycopg://postgres:disposable-ci-only@127.0.0.1:5432/doobielogic_release_test
      DOOBIELOGIC_PG_RELEASE_TEST: '1'
      AI_PROVIDER_MODE: disabled
      AI_PROVIDER_ORDER: none
      AI_ALLOW_CLOUD_FALLBACK: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r backend/requirements.txt pytest httpx
      - name: Migrate only the disposable PostgreSQL service
        run: |
          mkdir -p artifacts/pc-postgres
          git rev-parse HEAD > artifacts/pc-postgres/tested-commit.txt
          set -o pipefail
          python -m alembic upgrade head 2>&1 | tee artifacts/pc-postgres/migration.log
          # This workflow owns a disposable loopback PostgreSQL service only.
          # Verify empty-table rollback before any acceptance fixture writes.
          python -m alembic downgrade -1 2>&1 | tee artifacts/pc-postgres/empty-rollback.log
          python -m alembic upgrade head 2>&1 | tee artifacts/pc-postgres/reupgrade.log
      - name: Extraction query-budget and connection-safety regressions
        run: python -m pytest -q tests/test_extraction_overview_performance.py --junitxml=artifacts/pc-postgres/extraction-query-regressions.xml
      - name: Security observer privacy and authorization regressions
        run: python -m pytest -q tests/test_security_center_scaffold.py tests/test_security_center_observer.py --junitxml=artifacts/pc-postgres/security-observer.xml
      - name: Exercise real JWT authorization and saved workflows
        run: |
          mkdir -p artifacts/pc-postgres
          git rev-parse HEAD > artifacts/pc-postgres/tested-commit.txt
          python -m pytest -q scripts/acceptance/pc_release_postgres_acceptance.py --junitxml=artifacts/pc-postgres/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc-release-postgres-evidence
          path: artifacts/pc-postgres
          retention-days: 7
          if-no-files-found: warn
