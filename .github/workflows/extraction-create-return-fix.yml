name: Apply exact Extraction create-return fix
on:
  pull_request:
    paths:
      - '.github/workflows/extraction-create-return-fix.yml'
permissions:
  contents: read
concurrency:
  group: extraction-create-return-fix
  cancel-in-progress: true
jobs:
  apply-reviewed-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/current-inventory-continuity'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply hash-checked navigation guard and its regression
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          expected = {
              'frontend/src/pages/ExtractionOperatorWorkspace.tsx': 'b0d0d956555a205ea2275b67e2478ef0eeb9f3dd',
              'frontend/e2e/extraction-run-continuity.spec.ts': 'fbb094ad5fc58d4f280066776c638fb2ccdd5c27',
          }
          for name, sha in expected.items():
              assert subprocess.check_output(['git', 'hash-object', name]).decode().strip() == sha, f'Reconcile concurrent changes in {name}'
          page = Path('frontend/src/pages/ExtractionOperatorWorkspace.tsx')
          old = '  const [creating, setCreating] = useState(false);'
          new = old + '\n  // Browser history can restore a run without calling the click handler.\n  useEffect(()=>{if(selectedRunId)setCreating(false)},[selectedRunId]);'
          source = page.read_text()
          assert source.count(old) == 1
          page.write_text(source.replace(old, new))
          spec = Path('frontend/e2e/extraction-run-continuity.spec.ts')
          spec.write_text(spec.read_text() + '''
          test("browser Back closes a new-run form before restoring the prior run", async ({ page }) => {
            const state = await install(page);
            await page.goto("/production/extraction?extractionView=runs&extractionRun=second");
            const floor = page.locator(".extraction-operator-workspace");
            await expect(floor.getByRole("heading", { name: "BATCH-SECOND", exact: true })).toBeVisible();
            await floor.getByRole("button", { name: "New run", exact: true }).click();
            await expect(floor.getByRole("heading", { name: "Reserve source material", exact: true })).toBeVisible();
            await expect(floor.getByRole("heading", { name: "BATCH-SECOND", exact: true })).toHaveCount(0);
            await page.goBack();
            await expect(page).toHaveURL(/extractionRun=second/);
            await expect(floor.getByRole("heading", { name: "BATCH-SECOND", exact: true })).toBeVisible();
            await expect(floor.getByRole("heading", { name: "Reserve source material", exact: true })).toHaveCount(0);
            await expect(floor.getByRole("button", { name: "New run", exact: true })).toBeVisible();
            expect(state.writes).toEqual([]);
          });
          ''')
      - name: Commit the exact candidate without retaining the write-capable helper
        run: |
          git diff --check
          git add frontend/src/pages/ExtractionOperatorWorkspace.tsx frontend/e2e/extraction-run-continuity.spec.ts
          git rm .github/workflows/extraction-create-return-fix.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Close stale creation state when browser history restores an exact Extraction run'
          git push origin HEAD:refs/heads/codex/current-inventory-continuity
