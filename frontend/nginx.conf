map $host $doobielogic_marketing_host {
  default 0;
  doobielogic.io 1;
  www.doobielogic.io 1;
}

map $doobielogic_marketing_host $doobielogic_robots_tag {
  0 "noindex, nofollow, noarchive, nosnippet";
  1 "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1";
}

map $doobielogic_marketing_host $doobielogic_robots_body {
  0 "User-agent: *\nDisallow: /\n";
  1 "User-agent: *\nAllow: /\nSitemap: https://doobielogic.io/sitemap.xml\n";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header X-Robots-Tag $doobielogic_robots_tag always;

  location = /robots.txt {
    access_log off;
    default_type text/plain;
    return 200 $doobielogic_robots_body;
  }

  location = /sitemap.xml {
    if ($doobielogic_marketing_host = 0) { return 404; }
    try_files $uri =404;
    default_type application/xml;
  }

  location = /release.json {
    try_files $uri =404;
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $doobielogic_robots_tag always;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $doobielogic_robots_tag always;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }
}
